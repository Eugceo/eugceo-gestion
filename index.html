<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EUGCEO Gestion</title>
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EUGCEO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout : appli téléphone — en-tête collant, une colonne, barre d'onglets fixe en bas avec bouton central « + ». Charte EUGCEO : noir, crème, bronze, gris. */
:root{
  --bg:#ffffff; --surface:#f6f6f6; --fg:#111111; --muted:#5c5c5c; --line:#e3e3e3;
  --accent:#111111; --accent-fg:#ffffff; --soft:#efefef; --marron:#5e4c42;
  --ok:#2f6b47; --warn:#9a5b12; --bad:#a3322a;
  --ok-bg:#e1ece4; --warn-bg:#f4e7d3; --bad-bg:#f5dfdc;
  --display:"Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --body:"Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1c1c1c; --fg:#ffffff; --muted:#a8a8a8; --line:#333333;
  --accent:#ffffff; --accent-fg:#111111; --soft:#262626;
  --ok:#7fc39a; --warn:#e3a95c; --bad:#ec8a80;
  --ok-bg:#1d2b22; --warn-bg:#30251a; --bad-bg:#33201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1c1c1c; --fg:#ffffff; --muted:#a8a8a8; --line:#333333;
  --accent:#ffffff; --accent-fg:#111111; --soft:#262626;
  --ok:#7fc39a; --warn:#e3a95c; --bad:#ec8a80;
  --ok-bg:#1d2b22; --warn-bg:#30251a; --bad-bg:#33201e; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
img{max-width:100%}[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.login-in{display:flex;flex-direction:column;gap:8px;padding-block:48px 32px;max-width:420px}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}
.login-brand img{border-radius:18px}
.pw{display:flex;align-items:center;gap:6px}.pw input{flex:1}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;gap:6px;align-items:center}
.line.tr{grid-template-columns:minmax(0,1fr) 5.2em 0 auto}
.line.tr .trLib{grid-column:1/-1;grid-row:2}
.line.mt{grid-template-columns:minmax(0,1fr) 4.2em auto auto}
.line.av{grid-template-columns:minmax(0,1fr) 6.5em auto}
.line select,.line input{padding:8px 8px;font-size:15px}
.line .u{color:var(--muted);font-size:13px}
.line .rm{padding:6px;color:var(--muted)}
.addline{align-self:flex-start;padding-left:0}
.docrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
fieldset .docrow:first-of-type{border-top:0}
.list .docrow{padding:12px 14px}
.docinfo{display:flex;flex-direction:column;min-width:0;flex:1 1 12em}
.docinfo span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.docctl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.doclink{color:var(--accent);font-weight:500}
.linkrow{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.btn.small{width:auto;padding:8px 14px;font-size:13px}
.login-links{display:flex;flex-direction:column;align-items:center;gap:2px}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;--fg:#ffffff;--muted:#bdbdbd;--line:#2a2a2a;background:#111111;color:#ffffff;border-bottom:1px solid #111111}
header.top .wrap{display:flex;align-items:baseline;gap:12px;padding-block:12px 10px}
header.top .reload{margin-left:auto;align-self:center;background:none;border:0;padding:4px;color:#bdbdbd;cursor:pointer;line-height:0}
header.top .reload svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header.top .reload:hover{color:#C4A046}
.majbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.majbar[hidden]{display:none}.majbar button{background:#C4A046;color:#111;border:0;border-radius:999px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer}
.brand{font-family:var(--display);font-weight:600;letter-spacing:.32em;font-size:15px}
h1{font-family:var(--display);font-weight:500;font-size:22px;margin:0;flex:1;text-wrap:balance}
.status{font-size:12px;color:var(--muted)}
main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.num{font-variant-numeric:tabular-nums}
.money-big{font-family:var(--display);font-size:40px;font-weight:600;line-height:1}
.hero{background:var(--fg);color:var(--bg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{color:inherit;opacity:.7}
.hero small{opacity:.75;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:19px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar strong{font-family:var(--display);font-size:20px;font-weight:600;text-transform:capitalize}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .s{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.row .v{font-weight:600;text-align:right;white-space:nowrap}
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.02em}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;box-sizing:border-box}
.note{font-size:13px;color:var(--muted);margin:0}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-block:6px}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
nav.tabs .plus{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:28px;line-height:1;display:grid;place-items:center;padding:0;margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav.tabs .plus[disabled]{opacity:.35}
/* feuille de saisie */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.sheet-head .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheet-head h2{flex:1}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;padding:8px 4px}
form.f{display:flex;flex-direction:column;gap:14px;padding-block:16px 40px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 6px}
details.more{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
details.more summary{cursor:pointer;font-weight:500;font-size:14px}
details.more[open] summary{margin-bottom:12px}
details.more>div{display:flex;flex-direction:column;gap:12px}
.preview{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.preview .code{font-size:14px;font-weight:600;color:var(--fg)}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:13px 18px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer;width:100%}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line)}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:16px}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.choice b{font-family:var(--display);font-size:19px;font-weight:600}
.choice span{font-size:12.5px;color:var(--muted)}
.att{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.att img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.att a{color:var(--accent)}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}
.months{display:flex;flex-wrap:wrap;gap:6px}
.months button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:5px 9px;cursor:pointer;text-transform:capitalize}
.months button[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
@media (max-width:360px){.three{grid-template-columns:1fr 1fr}.money-big{font-size:34px}}
.pagehead{display:flex}
.back{padding-left:0}
.ptitle{font-size:26px}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:6px 0 0}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl thead th{border-top:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl .r{text-align:right}.tbl .cap{text-transform:capitalize}.tbl .muted{color:var(--muted)}
.tbl tr.grp td{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
.tbl tr.sub td{font-weight:600}.tbl tr.tot td{font-weight:600;font-size:15px}
.tbl .pos{color:var(--ok)}.tbl tr.neg td:last-child{color:var(--bad)}
.tbl input.inv{width:4.5em;text-align:right;padding:6px 8px}
.kv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.kvline{display:flex;justify-content:space-between;gap:10px}
.gauge{position:relative;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.gfill{height:100%;background:var(--ok)}.gfill.warn{background:var(--warn)}.gfill.bad{background:var(--bad)}
.gmark{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.5}
.line.rf{grid-template-columns:minmax(0,1fr) 5em 4em auto}
.line.rm2{grid-template-columns:minmax(0,1fr) 6em auto}
.line.rm3{grid-template-columns:minmax(0,1fr) 5em 4em auto}
.line.lx3{grid-template-columns:minmax(0,1fr) 5em 4em auto}
.line.lx2{grid-template-columns:minmax(0,1fr) 4em auto}
.line.lx1{grid-template-columns:minmax(0,1fr) auto}
h3.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted,#777);margin:18px 0 8px;font-weight:500}table.tbl{width:100%;border-collapse:collapse;font-size:14px}table.tbl th,table.tbl td{padding:8px 6px;border-bottom:1px solid var(--line,#eee);text-align:left}table.tbl .num{text-align:right}
.line.fq{grid-template-columns:6.5em 3em 3em 4em 4em 4em 4em minmax(0,1fr) auto;align-items:center}.line.fq .pxu{white-space:normal}.hint{white-space:pre-line}
.pxu{font-size:12px;font-weight:400;color:var(--muted,#777);white-space:nowrap}.pxu.warn{color:#a8761a}.pxu.bad{color:#b3261e}
.lxd{border:1px solid var(--line);border-radius:var(--r);padding:0}.lxd>summary{cursor:pointer;padding:12px 14px;font-weight:500;list-style-position:inside}.lxd[open]>summary{border-bottom:1px solid var(--line)}.lxd>fieldset{border:0;border-radius:0}.lxd .muted{color:#888;font-weight:300}
.line.head span{font-size:12px;color:var(--muted,#777)}
.line.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.invoice{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:40px 32px 28px;display:flex;flex-direction:column;gap:22px;font-family:Poppins,system-ui,sans-serif;font-size:12.5px;line-height:1.55}
.iv-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.iv-ec{width:46px;height:28px}.iv-ec path{fill:#C4A046}
.iv-brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;letter-spacing:.42em;font-weight:500;margin-right:-.42em}
.iv-tag{font-size:9.5px;letter-spacing:.4em;text-transform:uppercase;color:#8a7a5a;margin-right:-.4em}
.iv-rule{height:1px;background:linear-gradient(90deg,transparent,#C4A046 18%,#C4A046 82%,transparent)}
.iv-row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.iv-lbl{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:#a8883a;margin-bottom:6px}
.iv-client{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:600;line-height:1.2}
.iv-right{text-align:right}.iv-num{font-family:Poppins,system-ui,sans-serif;font-size:16px;font-weight:500;letter-spacing:.08em;line-height:1.4;margin-bottom:2px}
.iv-mini{display:block;font-size:8.5px;color:#8a8a8a;letter-spacing:.02em;margin-top:1px}
.iv-small{font-size:11px;color:#6b6b6b}.iv-code{letter-spacing:.06em}
.iv-paid{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid #C4A046;color:#8a6d22;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.iv-tbl{width:100%;border-collapse:collapse}
.iv-tbl th{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:#a8883a;font-weight:500;border-bottom:1px solid #111;padding:8px 4px;text-align:left}
.iv-tbl td{padding:12px 4px;border-bottom:1px solid #ece6dc;vertical-align:top}
.iv-tbl .r{text-align:right}.iv-tbl .num,.iv-total .num,.iv-sub .num{white-space:nowrap}
.iv-des{font-weight:500}
.iv-total{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0;margin-left:auto;min-width:min(100%,300px)}
.iv-total span{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#C4A046}
.iv-total b{font-family:Poppins,system-ui,sans-serif;font-size:19px;font-weight:600;letter-spacing:.01em}
.iv-sub{margin-left:auto;min-width:min(100%,300px);display:flex;flex-direction:column;gap:6px;font-size:11.5px;margin-top:-12px}
.iv-sub>div{display:flex;justify-content:space-between;gap:12px;padding:0 4px}
.iv-reste{font-weight:600;border-top:1px solid #ece6dc;padding-top:6px!important}
.iv-merci{text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;margin:6px 0 0}
.iv-f{margin-top:auto;display:flex;flex-direction:column;gap:3px;text-align:center;font-size:9.5px;color:#7a7a7a;letter-spacing:.02em}.iv-f p{margin:0}.iv-f .iv-rule{margin-bottom:10px}
@media print{
  header.top,nav.tabs,.noprint,.toast,body::before{display:none!important}
  html,body{background:#fff!important}
  body{padding-left:0!important}
  main{padding:0!important}.wrap{max-width:none;padding:0!important}
  .invoice{border:0;padding:0}
  @page{margin:16mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--ink,#111)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mgrid:empty{display:none}
.mthumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:3/4;background:var(--marron)}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover;display:block}
.mthumb .mctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.55)}
.mthumb .mctl .linkbtn{color:#fff;padding:6px 8px;min-height:0}

/* ===== Couche « grande maison » : or, noir, blanc, finesse ===== */
:root{--gold:#C4A046;--gold-d:#9b7c2e;--hair:#ece6dc;--shadow:0 1px 2px rgba(17,17,17,.04),0 8px 24px rgba(17,17,17,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hair:#2c2a26;--shadow:none}}
.intro{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .9s,visibility 0s .9s}
.intro svg{width:92px;height:56px;animation:ecIn 1.4s cubic-bezier(.22,.8,.24,1) both}
.intro span{font:500 17px/1 var(--display);letter-spacing:.6em;padding-left:.6em;color:#111;animation:motIn 1.4s .3s cubic-bezier(.22,.8,.24,1) both}
.intro small{font:500 9px/1 var(--body);letter-spacing:.5em;padding-left:.5em;text-transform:uppercase;color:var(--gold-d);animation:motIn 1.4s .6s cubic-bezier(.22,.8,.24,1) both}
.intro.fini{opacity:0;visibility:hidden}
@keyframes ecIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes motIn{from{opacity:0;transform:translateY(8px);letter-spacing:.9em}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro{display:none}}
header.top{border-bottom:0;box-shadow:inset 0 -1px 0 rgba(196,160,70,.55)}
header.top .wrap{align-items:center}
.hd-ec{width:26px;height:16px;flex:none;margin-right:-4px}
header.top .brand{letter-spacing:.42em;font-size:12px}
header.top h1{font-family:var(--display);font-weight:500;letter-spacing:.02em}
.hero{background:#111;color:#fff;border-radius:16px;padding:22px 20px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(17,17,17,.18)}
.hero::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero .eyebrow{color:var(--gold)!important;letter-spacing:.28em}
.money-big{font-family:var(--display);font-variant-numeric:lining-nums;font-weight:500}
.tile{background:var(--bg);border:1px solid var(--hair);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile>span:first-child{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d)}
.tile b{font-size:19px;letter-spacing:-.01em}
.list{background:var(--bg);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow)}
.row{border-top-color:var(--hair);transition:background .15s}
.row:hover{background:rgba(196,160,70,.06)}
.row .t{font-weight:500}
.sitebtn{margin-top:4px;background:none;border:1px solid var(--hair);border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;color:var(--fg);cursor:pointer}
.sitebtn:hover{border-color:var(--gold);color:var(--gold-d)}
.sitebtn.on{border-color:rgba(196,160,70,.6);color:var(--gold-d);background:rgba(196,160,70,.08)}
section>h2,.pagehead h2,.ptitle,main h2{font-family:var(--display);font-weight:500;letter-spacing:.01em}
section>h2::after{content:"";display:block;width:28px;height:1px;background:var(--gold);margin-top:6px}
.seg button{background:var(--bg);border-color:var(--hair);transition:all .15s}
.seg button[aria-pressed="true"]{background:#111;color:var(--gold);border-color:#111}
.monthbar .iconbtn,.iconbtn{border-color:var(--hair)}
nav.tabs{background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs{background:rgba(17,17,17,.92)}}
nav.tabs [data-tab][aria-current="page"]{color:var(--fg)}
nav.tabs [data-tab][aria-current="page"] svg{stroke:var(--gold-d)}
nav.tabs [data-tab][aria-current="page"]::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--gold);margin:3px auto 0}
nav.tabs .plus{background:#111;color:var(--gold);box-shadow:0 0 0 3px var(--bg),0 0 0 4px rgba(196,160,70,.7),0 8px 20px rgba(17,17,17,.25)}
.btn{letter-spacing:.04em;transition:background .2s,color .2s,box-shadow .2s}
.btn:not(.ghost):not(.danger):hover{background:#111;color:var(--gold);box-shadow:0 6px 18px rgba(17,17,17,.2)}
.btn.ghost{background:transparent;border-color:var(--hair);color:var(--fg)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-d)}
.field>label,.field .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.line input,.line select{background:var(--bg);border:1px solid var(--hair);border-radius:10px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus,.line input:focus,.line select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,160,70,.18)}

.preview{background:linear-gradient(180deg,rgba(196,160,70,.07),rgba(196,160,70,.02));border:1px solid rgba(196,160,70,.28);border-radius:12px}
.sheet-head{border-bottom:1px solid var(--hair)}
.sheet-head h2{font-family:var(--display);font-weight:500}
.choice{background:var(--bg);border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}

  nav.tabs button svg{width:20px;height:20px}

  nav.tabs [data-tab][aria-current="page"]{background:#111;color:#fff}
  nav.tabs [data-tab][aria-current="page"] svg{stroke:var(--gold)}
  nav.tabs [data-tab][aria-current="page"]::after{display:none}
  nav.tabs .plus{order:-1;display:flex;flex-direction:row;align-items:center;width:auto;height:auto;border-radius:999px;margin:0 0 18px;padding:12px 16px;font-size:15px;justify-content:center;box-shadow:0 6px 18px rgba(17,17,17,.18)}
  nav.tabs .plus::after{content:"Ajouter";font-weight:600;letter-spacing:.06em;margin-left:8px}
  /* accueil sur deux colonnes */
  body[data-tab="accueil"] #view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px;align-items:start}
  body[data-tab="accueil"] #view>.hero,body[data-tab="accueil"] #view>.monthbar,body[data-tab="accueil"] #view>.grid2,body[data-tab="accueil"] #view>.banner{grid-column:1/-1}

  .sheet{left:auto;width:min(640px,100vw);border-left:1px solid var(--hair);box-shadow:-20px 0 60px rgba(17,17,17,.18);animation:panelIn .25s ease-out}
  .sheet .wrap{max-width:none;padding-left:32px;padding-right:32px}
  body:has(#sheet:not([hidden]))::after{content:"";position:fixed;inset:0;z-index:19;background:rgba(17,17,17,.28)}
  .choices{grid-template-columns:repeat(2,1fr)}
  .toast,.majbar{bottom:28px}
  .toast{left:calc(50% + 124px)}.majbar{left:calc(50% + 124px)}
}

function addMonths(k,d){let [y,m]=k.split("-").map(Number);m+=d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+String(m).padStart(2,"0")}

/* ---------- codes produits (même règle que le classeur) ---------- */
function baseCode(p){
  if(!p.modele)return"";

  if(isPrestation(p))return"PR-"+mod;
  const parts=[mod];
  const cons=(T_CODES[p.construction]||"")+(p.longueur?String(p.longueur):"");
  if(cons)parts.push(cons);
  if(isBundle(p)&&p.typeBundle)parts.push(T_CODES[p.typeBundle]||initials(p.typeBundle));
  const taille=p.laceTaille?(T_CODES[p.laceTaille]||String(p.laceTaille).toUpperCase().replace(/\s/g,"")):"";
  const lace=taille+(T_CODES[p.laceQualite]||"");
  if(lace)parts.push(lace);
  const de=n(p.densite);if(de)parts.push(String(Math.round(de<10?de*100:de)));
  if(p.cheveux)parts.push(T_CODES[p.cheveux]||initials(p.cheveux));
  if(p.couleur)parts.push(codeCouleur(p.couleur)||initials(p.couleur));
  return parts.join("-");
}
function codeFor(p,selfId,oldCode){
  const base=baseCode(p);if(!base)return"";

  if(oldCode&&(oldCode===base||(oldCode.startsWith(base+"-")&&/^\d+$/.test(oldCode.slice(base.length+1))))&&!others.some(x=>x.code===oldCode))return oldCode;
  return uniqueCode(base,selfId);
}
function uniqueCode(base,selfId){
  const used=new Set(S.produits.filter(x=>x.id!==selfId).map(x=>x.code));
  if(!used.has(base))return base;
  let k=2;while(used.has(base+"-"+k))k++;return base+"-"+k;
}
function isPrestation(p){return p.type?p.type==="Prestation":n(p.prixAchat)===0}
function designation(p){
  if(!p)return"";

/* montant des créations avant remise : quantité × prix unitaire + suppléments (coloration, matières…) */
function venteBrut(v){return r2(Math.max(1,n(v.quantite)||1)*n(v.prixTTC)+n(v.supplements))}
function venteTotal(v){return r2(venteBrut(v)-n(v.remise)+n(v.port))}
function venteEncaisse(v){
  const t=venteTotal(v);
  if(v.statut==="Payée")return t;
  if(v.statut==="Remboursée")return 0;
  if(v.statut==="Annulée")return v.avanceType==="Arrhes"?n(v.avanceMontant):0;

  for(const a of S.achats)if(!a.datePaiement)add(a.fournisseur,achatTotal(a));
  for(const d of S.depenses)if(!d.datePaiement)add(d.fournisseur,n(d.montant));
  return Object.values(M).map(x=>({...x,m:r2(x.m)})).filter(x=>x.m>0).sort((a,b)=>b.m-a.m)}

/* même fournisseur même s'il est écrit un peu différemment (majuscules, accents, « Co., Ltd. »…) */
function fournKey(s){return nomSimple(s).replace(/[.,()&'’\-]/g," ").replace(/\b(co|ltd|limited|company|sarl|sasu|sas|inc|llc|gmbh|eurl|sa)\b/g," ").replace(/\s+/g," ").trim()}
function commandes(achats){
  const M={};for(const a of achats){const k=a.numFacture||a.date||a.id;(M[k]=M[k]||[]).push(a)}
  return Object.values(M).map(ls=>{ls.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    return{date:ls[0].date,num:ls[0].numFacture||"",lignes:ls,total:r2(ls.reduce((t,x)=>t+achatTotal(x),0)),recu:ls.every(x=>x.dateReception),paye:ls.every(x=>x.datePaiement),path:(ls.find(x=>x.justificatif)||{}).justificatif||"",docId:(ls.find(x=>x.justificatif)||ls[0]).id}}).sort((a,b)=>(b.date||"").localeCompare(a.date||""))}
function fournisseursListe(){
  const M=new Map();const rank={achat:0,abo:1,dep:2};
  const get=(nom,type)=>{nom=String(nom||"").trim();const k=fournKey(nom);if(!k)return null;let f=M.get(k);
    if(!f){f={key:k,nom,type,achats:[],depenses:[],abos:[],pays:""};M.set(k,f)}
    if(nom.length>f.nom.length)f.nom=nom;if(rank[type]<rank[f.type])f.type=type;return f};
  for(const a of S.achats){const f=get(a.fournisseur,"achat");if(f){f.achats.push(a);if(a.pays)f.pays=a.pays}}
  for(const a of S.abonnements){const f=get(a.fournisseur,"abo");if(f)f.abos.push(a)}
  for(const d of S.depenses){const f=get(d.fournisseur,"dep");if(f)f.depenses.push(d)}
  return[...M.values()].map(f=>{const cmds=commandes(f.achats);
    const paye=r2(f.achats.filter(a=>a.datePaiement).reduce((t,a)=>t+achatTotal(a),0)+f.depenses.filter(d=>d.datePaiement).reduce((t,d)=>t+n(d.montant),0)+f.abos.reduce((t,a)=>t+aboPaid(a),0));
    const apayer=r2(f.achats.filter(a=>!a.datePaiement).reduce((t,a)=>t+achatTotal(a),0)+f.depenses.filter(d=>!d.datePaiement).reduce((t,d)=>t+n(d.montant),0));
    const enRoute=cmds.filter(c=>!c.recu).length;
    const der=[...f.achats.map(a=>a.date),...f.depenses.map(d=>d.date),...f.abos.flatMap(a=>(a.mois||[]).map(m=>m+"-01"))].filter(Boolean).sort().pop()||"";
    const abo=f.abos.find(a=>!a.fin||a.fin>=today());
    const parts=[];if(f.pays)parts.push(f.pays);if(cmds.length)parts.push(cmds.length+" commande"+(cmds.length>1?"s":""));if(f.depenses.length)parts.push(f.depenses.length+" dépense"+(f.depenses.length>1?"s":""));if(abo)parts.push((abo.description||"abonnement")+" · "+eur(n(abo.montant))+" / mois");if(enRoute)parts.push(enRoute+" colis en route");
    return{...f,cmds,paye,apayer,enRoute,der,resume:parts.join(" · ")}}).sort((a,b)=>(b.der||"").localeCompare(a.der||""))}
function carnetFournisseurs(){
  const q=nomSimple(S.fq||"");let L2=fournisseursListe();if(q)L2=L2.filter(f=>nomSimple(f.nom+" "+f.pays+" "+f.resume).includes(q));
  const row=f=>`<button class="row" data-act="page" data-p="fournisseur" data-id="${esc(f.key)}"><span class="t">${esc(f.nom)}</span><span class="v num">${eur(f.paye+f.apayer)}</span><span class="s">${esc(f.resume)}${f.apayer?` <span class="chip warn">à payer ${eur(f.apayer)}</span>`:""}</span></button>`;
  const G=(t,type)=>{const r=L2.filter(f=>f.type===type);return r.length?`<h3 class="sec">${t}</h3><div class="list">${r.map(row).join("")}</div>`:""};
  return`<input class="search" id="fq" type="search" placeholder="Chercher un fournisseur : nom, pays" value="${esc(S.fq||"")}" autocomplete="off">
  ${loadingOr("achats",(G("Marchandise","achat")+G("Abonnements","abo")+G("Dépenses et services","dep"))||`<div class="empty">${q?"Aucun fournisseur trouvé.":"Les fournisseurs apparaissent dès le premier achat, la première dépense ou le premier abonnement."}</div>`)}
  <p class="note">Créés tout seuls à partir des achats, dépenses et abonnements. Un même fournisseur écrit un peu différemment (majuscules, accents, « Co., Ltd. ») est regroupé. Un clic : toutes ses commandes et toutes ses factures.</p>`}
function pFournisseur(key){
  const f=fournisseursListe().find(x=>x.key===key);
  const back=`<div class="pagehead noprint"><button class="linkbtn back" data-act="goto" data-tab="carnet" data-filter="fournisseurs">‹ Carnet</button></div>`;
  if(!f)return`${back}<div class="empty">Fournisseur introuvable.</div>`;
  const ro=!(db&&canWrite);
  const items=[];
  for(const c of f.cmds){const nb=c.lignes.reduce((t,x)=>t+n(x.quantite),0);const ids=c.lignes.map(x=>x.id).join(",");
    const lignes=c.lignes.map(a=>{const p=prod(a.produitId);const pu=n(a.prixUnit);return`<button type="button" data-act="edit" data-col="achats" data-id="${esc(a.id)}">${n(a.quantite)} × ${esc(p?designation(p):"article ?")} · ${pu?(a.devise&&a.devise!=="EUR"?pu+" "+esc(a.devise):eur(pu))+" pièce":""}</button>`}).join("");
    const dates=[];if(c.paye){const dp=c.lignes.map(x=>x.datePaiement).sort().pop();dates.push("payée le "+dfr(dp))}if(c.recu){const dr=c.lignes.map(x=>x.dateReception).sort().pop();dates.push("reçue le "+dfr(dr))}
    items.push({d:c.date,html:`<div class="card"><span class="top"><b>${c.num?"Commande n° "+esc(c.num):"Commande du "+dfr(c.date)}</b><b class="num">${eur(c.total)}</b></span>
      <span class="lines">${lignes}<span>${dfr(c.date)} · ${nb} pièce${nb>1?"s":""}${dates.length?" · "+dates.join(" · "):""}</span></span>
      <span class="chips">${c.recu?`<span class="chip ok">reçue · en stock</span>`:`<span class="chip warn">en route · pas encore reçue</span>`}${c.paye?"":`<span class="chip warn">à payer</span>`} ${docCtl("achats",c.docId,c.path,"set")}
      ${ro?"":`${c.recu?"":`<button type="button" class="sitebtn" data-act="recu-cmd" data-col="achats" data-ids="${esc(ids)}">Marquer reçue</button>`}${c.paye?"":`<button type="button" class="sitebtn" data-act="payer-cmd" data-col="achats" data-ids="${esc(c.lignes.filter(x=>!x.datePaiement).map(x=>x.id).join(","))}">Marquer payée</button>`}`}</span></div>`})}
  for(const d of f.depenses)items.push({d:d.date,html:`<div class="card"><span class="top"><b>${esc(d.description||d.categorie||"Dépense")}</b><b class="num">${eur(n(d.montant))}</b></span>
    <span class="lines"><button type="button" data-act="edit" data-col="depenses" data-id="${esc(d.id)}">${dfr(d.date)}${d.numFacture?" · n° "+esc(d.numFacture):""}${d.categorie?" · "+esc(d.categorie):""} · ouvrir</button></span>
    <span class="chips">${d.datePaiement?`<span class="chip ok">payée</span>`:`<span class="chip warn">à payer</span>`} ${docCtl("depenses",d.id,d.justificatif,"set")}${ro||d.datePaiement?"":` <button type="button" class="sitebtn" data-act="payer-cmd" data-col="depenses" data-ids="${esc(d.id)}">Marquer payée</button>`}</span></div>`});
  items.sort((a,b)=>(b.d||"").localeCompare(a.d||""));
  const byM={};for(const x of items){const m=ym(x.d)||"";(byM[m]=byM[m]||[]).push(x.html)}
  const mois=Object.keys(byM).sort().reverse().map(m=>`<h3 class="sec">${m?esc(monthName(m)):"Sans date"}</h3><div class="cards">${byM[m].join("")}</div>`).join("");
  const abos=f.abos.length?`<h3 class="sec">Abonnements</h3><div class="list">${f.abos.map(a=>`<button class="row" data-act="edit" data-col="abonnements" data-id="${esc(a.id)}"><span class="t">${esc(a.description||"Abonnement")}</span><span class="v num">${eur(n(a.montant))} / ${esc((a.frequence||"Mensuel").toLowerCase()==="mensuel"?"mois":a.frequence)}</span><span class="s">depuis le ${dfr(a.debut)}${a.fin?" · jusqu'au "+dfr(a.fin):""} · ${(a.mois||[]).length} prélèvement${(a.mois||[]).length>1?"s":""} pointé${(a.mois||[]).length>1?"s":""} · ${eur(aboPaid(a))} payés</span></button>`).join("")}</div>`:"";
  /* ce que tu lui achètes : dernier prix de chaque article, comparé à la fourchette */
  const P={};for(const a of [...f.achats].sort((x,y)=>(x.date||"").localeCompare(y.date||""))){if(!a.produitId)continue;const o=P[a.produitId]=P[a.produitId]||{q:0,a:null};o.q+=n(a.quantite);o.a=a}
  const quoi=Object.entries(P).map(([id,o])=>{const p=prod(id);if(!p)return"";const a=o.a;const pu=n(a.prixUnit);const v=prixAchatEur(a);const c=catAchat(p);const F=c&&n(p.longueur)?fourchetteDe(c,p.longueur):null;
    const rep=F&&!F.vide&&v>0?(v>F.max?`<span class="chip warn">⬆ au-dessus de la fourchette</span>`:v<F.min?`<span class="chip ok">⬇ bon prix</span>`:`<span class="chip">✓ dans la fourchette</span>`):"";
    return`<button class="row" data-act="edit" data-col="produits" data-id="${esc(id)}"><span class="t">${esc(designation(p))}</span><span class="v num">${a.devise&&a.devise!=="EUR"?pu+" "+esc(a.devise):eur(pu)}</span><span class="s">${o.q} pièce${o.q>1?"s":""} achetée${o.q>1?"s":""} · dernier prix ${eur(v)} ${rep}</span></button>`}).join("");

  ${quoi?`<h3 class="sec">Ce que tu lui achètes</h3><div class="list">${quoi}</div>`:""}`}
async function lotUpdate(b,champ){const ids=(b.dataset.ids||"").split(",").filter(Boolean);if(!ids.length)return;b.disabled=true;
  try{for(const id of ids)await db.collection(b.dataset.col).doc(id).update({[champ]:today(),modifieLe:new Date().toISOString()});toast(champ==="dateReception"?"Reçue : ajoutée au stock":"Marquée payée")}catch(e){b.disabled=false;toast(dbErr(e))}}

const RDV_DEF={actif:true,ville:"Cesson-Sévigné",prestations:[{nom:"Pose de perruque",duree:120},{nom:"Pose de tissage",duree:180}],jours:{},fermes:[],pas:30,delaiH:24,horizonJ:45,marge:30,domicile:true,km:{tranche:5,prix:3,allerRetour:false,max:0}};
const JOURS_SEM=[[1,"Lundi"],[2,"Mardi"],[3,"Mercredi"],[4,"Jeudi"],[5,"Vendredi"],[6,"Samedi"],[7,"Dimanche"]];
function rdvCfg(){const c={...RDV_DEF,...((S.siteContenu||{}).rdv||{})};c.km={...RDV_DEF.km,...(((S.siteContenu||{}).rdv||{}).km||{})};return c}
function rdvListe(){return(S.demandes||[]).filter(d=>d.type==="rdv"&&d.date)}
function rdvSt(d){return d.rdvStatut||"À confirmer"}
function rdvFin(d){const[a,b]=String(d.heure||"0:0").split(":");const m=Number(a)*60+Number(b||0)+(Number(d.duree)||60);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function rdvPasse(d){return(d.date+" "+rdvFin(d))<(today()+" "+new Date().toTimeString().slice(0,5))}
function rdvJour(s){return new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function rdvDuree(m){m=Number(m)||0;const h=Math.floor(m/60),r=m%60;return h?(h+" h"+(r?" "+String(r).padStart(2,"0"):"")):r+" min"}
function rdvAConfirmer(){return rdvListe().filter(d=>rdvSt(d)==="À confirmer"&&!rdvPasse(d))}
function rdvMessage(d,kind){
  const pr=(d.nom||"").split(" ")[0];const quand=rdvJour(d.date)+" à "+String(d.heure).replace(":"," h ");const adr=(S.rdvPrive||{}).adresse||"";
  if(kind==="ok")return`Bonjour ${pr},\n\nVotre rendez-vous est confirmé : ${d.prestation}, ${quand} (environ ${rdvDuree(d.duree)}).\n${d.lieu==="domicile"?`Nous viendrons chez vous : ${d.adresseCliente||""}\nFrais de déplacement : ${eur(n(d.fraisDeplacement))}`:`Adresse : ${adr||"[adresse]"}`}\n\nÀ bientôt,\nEUGCEO`;
  if(kind==="non")return`Bonjour ${pr},\n\nMerci pour votre demande. Le créneau du ${quand} n'est malheureusement pas disponible. Vous pouvez choisir une autre date sur https://eugceo.fr/#/rendezvous ou nous répondre avec vos disponibilités.\n\nÀ bientôt,\nEUGCEO`;
  return`Bonjour ${pr},\n\nNous sommes désolés, nous devons annuler votre rendez-vous du ${quand}. Vous pouvez en choisir un autre sur https://eugceo.fr/#/rendezvous ou nous répondre avec vos disponibilités.\n\nÀ bientôt,\nEUGCEO`}
function rdvCarte(d){
  const st=rdvSt(d),ro=!(db&&canWrite);const tel=d.telephone?waNum(d.telephone):"";
  const kind=st==="Confirmé"?"ok":st==="Refusé"?"non":st==="Annulé"?"annule":"";
  const msg=kind?rdvMessage(d,kind):"";
  const prev=kind&&!rdvPasse(d)?`<span class="chips">${tel?`<a class="sitebtn" href="https://wa.me/${esc(tel)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Prévenir par WhatsApp</a>`:""}${d.email&&!ro?`<button type="button" class="sitebtn" data-act="rdv-mail" data-id="${esc(d.id)}" data-k="${kind}">Prévenir par e-mail</button>`:""}${d.prevenue?`<span class="chip ok">e-mail envoyé ${new Date(d.prevenue).toLocaleDateString("fr-FR")}</span>`:""}</span>`:"";
  const chip=st==="Confirmé"?"ok":st==="À confirmer"?"warn":"bad";
  return`<div class="card"><span class="top"><b>${esc(d.prestation||"Rendez-vous")}</b><span class="chip ${chip}">${esc(st.toLowerCase())}</span></span>
    <span class="lines"><span style="color:var(--fg);font-size:14.5px;text-transform:capitalize">${esc(rdvJour(d.date))} · ${esc(d.heure)}–${esc(rdvFin(d))}</span>
    <span>${d.lieu==="domicile"?`Chez la cliente : ${esc(d.adresseCliente||"?")} · environ ${esc(d.kmEstime??"?")} km · frais ${eur(n(d.fraisDeplacement))}`:"À "+esc(rdvCfg().ville)}</span>
    <span><b style="color:var(--fg);font-weight:500">${esc(d.nom||"")}</b>${d.telephone?` · <a href="tel:${esc(String(d.telephone).replace(/[^\d+]/g,""))}">${esc(d.telephone)}</a>`:""}${d.email?" · "+esc(d.email):""}</span>
    ${d.message?`<span>« ${esc(d.message)} »</span>`:""}</span>
    ${ro?"":`<span class="chips">${st==="À confirmer"?`<button type="button" class="btn small" data-act="rdv-st" data-id="${esc(d.id)}" data-st="Confirmé">Confirmer</button><button type="button" class="btn ghost small" data-act="rdv-st" data-id="${esc(d.id)}" data-st="Refusé">Refuser</button>`:""}${st==="Confirmé"&&!rdvPasse(d)?`<button type="button" class="btn ghost small" data-act="rdv-st" data-id="${esc(d.id)}" data-st="Annulé">Annuler</button>`:""}${st==="Confirmé"?`<button type="button" class="btn ghost small" data-act="rdv-vente" data-id="${esc(d.id)}">Créer la vente</button>`:""}${st!=="À confirmer"&&!rdvPasse(d)?`<button type="button" class="linkbtn" data-act="rdv-st" data-id="${esc(d.id)}" data-st="À confirmer">Remettre à confirmer</button>`:""}</span>`}
    ${prev}</div>`}
function pRdv(){
  const f=S.rdvFilter||"confirmer";const L=rdvListe();
  let X=f==="confirmer"?L.filter(d=>rdvSt(d)==="À confirmer"&&!rdvPasse(d)):f==="avenir"?L.filter(d=>rdvSt(d)==="Confirmé"&&!rdvPasse(d)):f==="passes"?L.filter(d=>rdvSt(d)==="Confirmé"&&rdvPasse(d)):L.filter(d=>["Refusé","Annulé"].includes(rdvSt(d))||(rdvSt(d)==="À confirmer"&&rdvPasse(d)));
  X.sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure));if(f==="passes"||f==="autres")X.reverse();
  const nb=L.filter(d=>rdvSt(d)==="À confirmer"&&!rdvPasse(d)).length;
  const cfg=rdvCfg();const ouvert=Object.values(cfg.jours||{}).some(x=>x&&x.length);
  return`${pageHead("Rendez-vous","Pris sur le site. Un créneau demandé est bloqué pour les autres clientes jusqu'à ta réponse. Après « Confirmer » ou « Refuser », préviens la cliente par WhatsApp ou par e-mail : le message est déjà écrit.")}
  ${ouvert?"":`<div class="banner">Aucun horaire n'est ouvert : le site affiche encore l'ancien formulaire. <button class="linkbtn" data-act="page" data-p="rdvreglages">Régler les jours et les heures</button></div>`}
  ${filterBar("rdvFilter",f,[["confirmer","À confirmer"+(nb?" ("+nb+")":"")],["avenir","À venir"],["passes","Passés"],["autres","Refusés, annulés"]])}
  <div class="cards">${X.map(rdvCarte).join("")||`<div class="empty">Rien ici.</div>`}</div>
  ${moreLinks([['data-act="page" data-p="rdvreglages"',"Jours, heures et prestations"]])}`}
async function rdvStatut(b){const d=rdvListe().find(x=>x.id===b.dataset.id);if(!d)return;const st=b.dataset.st;b.disabled=true;
  try{await db.collection("demandes").doc(d.id).update({rdvStatut:st,statut:st==="À confirmer"?"Nouvelle":"Traitée",traiteLe:new Date().toISOString(),prevenue:null});
    toast(st==="Confirmé"?"Confirmé : préviens la cliente":st==="Refusé"?"Refusé : préviens la cliente":st==="Annulé"?"Annulé : préviens la cliente":"Remis à confirmer");
    if(st==="Confirmé")S.rdvFilter="avenir";if(st==="Refusé"||st==="Annulé")S.rdvFilter="autres";render()}catch(e){b.disabled=false;toast(dbErr(e))}}
async function rdvMail(b){const d=rdvListe().find(x=>x.id===b.dataset.id);if(!d||!d.email)return;const k=b.dataset.k;b.disabled=true;
  const sub=k==="ok"?"Votre rendez-vous EUGCEO est confirmé":k==="non"?"Votre demande de rendez-vous EUGCEO":"Annulation de votre rendez-vous EUGCEO";
  try{await sendMail({to:d.email,subject:sub,text:rdvMessage(d,k)});await db.collection("demandes").doc(d.id).update({prevenue:new Date().toISOString()});toast("E-mail envoyé")}
  catch(e){b.disabled=false;toast(e&&e.code==="non_configure"?"L'envoi d'e-mails n'est pas configuré":"L'e-mail n'est pas parti. Utilise WhatsApp.")}}

    <div class="rdv-h">${JOURS_SEM.map(([j,l])=>`<div class="rdv-hl"><b>${l}</b><span>${t("j"+j+"a0",pl(j,0)[0])}<i>à</i>${t("j"+j+"b0",pl(j,0)[1])}</span><span>${t("j"+j+"a1",pl(j,1)[0])}<i>à</i>${t("j"+j+"b1",pl(j,1)[1])}</span></div>`).join("")}</div>
    ${F("fermes","Jours fermés (congés, jours pris)",`<textarea id="fermes" name="fermes" placeholder="Une date par ligne, ex. 24/12/2026">${esc((c.fermes||[]).map(x=>dfr(x)).join("\n"))}</textarea>`,"Une date par ligne. Ces jours-là, aucun créneau n'est proposé.")}
   </fieldset>
   <fieldset><legend>Prestations</legend>
    <div id="rdvPrest">${(c.prestations||[]).map(p=>rdvPrestLigne(p)).join("")}</div>
    ${ro?"":`<button type="button" class="linkbtn addline" data-act="rdvp-add">+ Ajouter une prestation</button>`}
    <p class="note">Durée en minutes : 120 = 2 h, 180 = 3 h. Le créneau bloqué dans l'agenda correspond à cette durée.</p>
   </fieldset>
   <fieldset><legend>Créneaux</legend>
    <div class="two">${F("pas","Un créneau toutes les (minutes)",inp("pas",c.pas,'inputmode="numeric"'))}${F("marge","Temps libre entre deux rendez-vous (minutes)",inp("marge",c.marge,'inputmode="numeric"'),"Pour la route ou le rangement.")}</div>
    <div class="two">${F("delaiH","Délai minimum avant un rendez-vous (heures)",inp("delaiH",c.delaiH,'inputmode="numeric"'),"24 = pas de rendez-vous pour le lendemain matin pris la veille au soir.")}${F("horizonJ","Réservable jusqu'à (jours)",inp("horizonJ",c.horizonJ,'inputmode="numeric"'))}</div>
   </fieldset>
   <fieldset><legend>Lieu et déplacement</legend>
    ${F("ville","Ville affichée sur le site",inp("ville",c.ville))}
    ${F("adresse","Adresse exacte (jamais affichée sur le site)",inp("adresse",P.adresse),"Envoyée à la cliente seulement dans le message de confirmation.")}
    <label class="chk"><input type="checkbox" name="domicile" ${c.domicile!==false?"checked":""}> Proposer le rendez-vous chez la cliente</label>
    <div class="two">${F("kmPrix","Prix par tranche (€)",money("kmPrix",c.km.prix))}${F("kmTranche","Tranche (km)",inp("kmTranche",c.km.tranche,'inputmode="numeric"'))}</div>
    <div class="two">${F("kmMax","Distance maximum (km)",inp("kmMax",c.km.max||"",'inputmode="numeric"'),"Vide = pas de limite.")}<label class="chk" style="align-self:end"><input type="checkbox" name="allerRetour" ${c.km.allerRetour?"checked":""}> Compter l'aller-retour</label></div>
    <p class="note">Exemple avec ces réglages : 12 km ${c.km.allerRetour?"(24 km aller-retour) ":""}→ ${eur(Math.ceil((c.km.allerRetour?24:12)/(n(c.km.tranche)||5))*n(c.km.prix))}. La distance est estimée par le site à partir de l'adresse de la cliente : tu peux ajuster avant de confirmer.</p>
   </fieldset>
   <fieldset><legend>Être prévenu</legend>
    ${F("notifEmail","E-mail qui reçoit les demandes",inp("notifEmail",P.notifEmail||"",'type="email" placeholder="'+esc(soc().email||"contact@eugceo.fr")+'"'),"Vide = l'e-mail de la société.")}
    <div class="two">${F("whatsappTel","Ton numéro WhatsApp",inp("whatsappTel",P.whatsappTel||"",'inputmode="tel" placeholder="+33 6 …"'))}${F("callmebotKey","Clé CallMeBot",inp("callmebotKey",P.callmebotKey||"",'autocomplete="off" spellcheck="false"'),"Facultatif : pour recevoir aussi un WhatsApp à chaque demande.")}</div>

function rdvPrestLigne(p){p=p||{};return`<div class="line rdvp"><input class="rpNom" value="${esc(p.nom||"")}" placeholder="Prestation" aria-label="Prestation"><input class="rpDur" inputmode="numeric" value="${esc(p.duree||"")}" placeholder="min" aria-label="Durée en minutes"><button type="button" class="linkbtn rm" data-act="line-rm" aria-label="Retirer">✕</button></div>`}
async function saveRdvReglages(form){
  const m=$("#rdvMsg");const E=form.elements;const v=k=>E[k]?String(E[k].value||"").trim():"";
  const jours={};for(const[j]of JOURS_SEM){const pl=[];for(const i of[0,1]){const a=v("j"+j+"a"+i),b=v("j"+j+"b"+i);if(a&&b){if(b<=a){m.textContent="Heures incohérentes le "+JOURS_SEM[j-1][1].toLowerCase()+" : la fin doit être après le début.";m.hidden=false;return}pl.push([a,b])}}if(pl.length)jours[j]=pl}
  const fermes=[];for(const l of v("fermes").split(/\n+/).map(x=>x.trim()).filter(Boolean)){const x=l.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/)||l.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!x){m.textContent="Date non comprise : « "+l+" ». Écris-la comme 24/12/2026.";m.hidden=false;return}
    fermes.push(x[1].length===4?`${x[1]}-${x[2]}-${x[3]}`:`${x[3].length===2?"20"+x[3]:x[3]}-${x[2].padStart(2,"0")}-${x[1].padStart(2,"0")}`)}
  const prestations=[...form.querySelectorAll(".rdvp")].map(l=>({nom:l.querySelector(".rpNom").value.trim(),duree:Math.round(n(l.querySelector(".rpDur").value))})).filter(p=>p.nom&&p.duree>0);
  if(!prestations.length){m.textContent="Indique au moins une prestation avec sa durée.";m.hidden=false;return}
  const cfg={...rdvCfg(),actif:!!E.actif.checked,ville:v("ville")||"Cesson-Sévigné",prestations,jours,fermes:[...new Set(fermes)].sort(),pas:Math.max(15,Math.round(n(v("pas")))||30),marge:Math.max(0,Math.round(n(v("marge")))),delaiH:Math.max(0,Math.round(n(v("delaiH")))),horizonJ:Math.min(180,Math.max(7,Math.round(n(v("horizonJ")))||45)),domicile:!!E.domicile.checked,
    km:{prix:n(v("kmPrix")),tranche:Math.max(1,Math.round(n(v("kmTranche")))||5),allerRetour:!!E.allerRetour.checked,max:Math.max(0,Math.round(n(v("kmMax"))))}};
  const em=v("notifEmail");if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){m.textContent="L'e-mail de notification semble incomplet.";m.hidden=false;return}
  try{await db.collection("site_contenu").doc("rdv").set(cfg);await db.doc("reglages/rdv").set({...(S.rdvPrive||{}),adresse:v("adresse"),notifEmail:em,whatsappTel:v("whatsappTel"),callmebotKey:v("callmebotKey"),modifieLe:new Date().toISOString()});
    delete form.dataset.dirty;m.hidden=true;toast("Rendez-vous : réglages enregistrés, en ligne")}catch(e){m.textContent=dbErr(e);m.hidden=false}}

function visTextes(p){
  if(!p)return{titre:"",l1:"",l2:"",prix:"",sur:"Nouvelle création"};
  const s=p.site||{};const titre=s.titre||((p.modele||"")+(p.longueur?" "+p.longueur+"″":""));
  const lace=[p.laceTaille,p.laceQualite].filter(Boolean).join(" ");
  const l1=[isBundle(p)?(p.typeBundle||"Bundle"):(p.construction||"").replace(/\s*\(.*\)/,""),lace].filter(Boolean).join(" · ");
  const de=n(p.densite);const l2=[p.cheveux,p.couleur,de?Math.round(de<10?de*100:de)+" %":""].filter(Boolean).join(" · ");
  const px=s.prix&&n(s.prix)>0?n(s.prix):prixBaseDe(p);
  return{titre,l1,l2,prix:px>0?String(Math.round(px))+" €":"",sur:stockQty(p)>0?"Disponible":"Sur commande"}}

function nextRef(col,prefix,digits){let max=0;for(const x of S[col]){const m=String(x.ref||x.numero||"").match(new RegExp("^"+prefix.replace(/[-]/g,"\\-")+"(\\d+)$"));if(m)max=Math.max(max,Number(m[1]))}return prefix+String(max+1).padStart(digits,"0")}
/* ---------- ambassadrices : code choisi, -X % pour la cliente (une fois), cagnotte en euros pour l'ambassadrice ---------- */
function RP(){const r=S.reglages||{};return{pct:n(r.parrainPct)||10,min:n(r.parrainMin)||150,delai:n(r.parrainDelai)||14}}
function normCode(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,20)}
function nomSimple(s){return String(s||"").replace(/^\s*\[test\]\s*/i,"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim()}
function telSimple(t){const d=String(t||"").replace(/\D/g,"");return d.length>=9?d.slice(-9):""}
function estTest(nom){return/^\s*\[test\]/i.test(nom||"")}
/* même règle que la base (est_titulaire) : même e-mail, ou même téléphone, ou même nom si ni e-mail ni téléphone connus */
function estTitulaire(c,nom,email,tel){const em=String(email||"").toLowerCase().trim(),tl=telSimple(tel),nm=nomSimple(nom);
  return!!((em&&String(c.email||"").toLowerCase()===em)||(tl&&telSimple(c.telephone)===tl)||(!c.email&&!telSimple(c.telephone)&&nm&&nomSimple(c.cliente)===nm))}
function ambDe(nom,email,tel){return(S.codes||[]).find(c=>estTitulaire(c,nom,email,tel))||null}
function tauxAmb(c){const R=RP();const g=k=>c&&c[k]!==""&&c[k]!=null?n(c[k]):null;return{pf:g("pctFilleule")??R.pct,pg:g("pctGain")??R.pct,min:g("min")??R.min}}
function addDays(d,k){const x=new Date((d||today())+"T12:00:00");x.setDate(x.getDate()+k);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function netCreations(v){return r2(venteBrut(v)-n(v.remise))}
/* même calcul que la base (_parrainage_etat) */
function etatAmb(c,exclId){
  const R=RP(),t=today(),T=tauxAmb(c);const vs=S.ventes.filter(v=>v.id!==exclId&&dansCA(v));const cmd=new Map();
  for(const v of vs){if(v.codePromo!==c.id||estTest(v.client))continue;const k=v.paiementId||v.id;
    const o=cmd.get(k)||{payee:true,d:"",cliente:v.client,date:v.date,ca:0,gain:0};o.payee=o.payee&&v.statut==="Payée";
    const dd=v.dateEncaissement||v.date||"";if(dd>o.d)o.d=dd;const net=netCreations(v);o.ca=r2(o.ca+net);
    o.gain=r2(o.gain+net*(v.parrainGainPct!==""&&v.parrainGainPct!=null?n(v.parrainGainPct):T.pg)/100);cmd.set(k,o)}
  let gains=0,att=0,ca=0;const list=[];
  for(const o of cmd.values()){o.acquis=addDays(o.d,R.delai);o.ok=o.payee&&o.acquis<=t;if(o.ok)gains+=o.gain;else att++;ca+=o.ca;list.push(o)}
  list.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const utilise=r2(vs.filter(v=>v.cagnotteCode===c.id).reduce((s2,v)=>s2+n(v.cagnotteMontant),0));
  return{...T,gains:r2(gains),utilise,solde:Math.max(0,r2(gains-utilise)),enAttente:att,commandes:list,ca:r2(ca)}
}
function dejaParrainee(d,exclId){return S.ventes.some(v=>v.id!==exclId&&v.codePromo&&dansCA(v)&&(d.email||telSimple(d.telephone)||d.client)&&estTitulaire({cliente:v.client,email:v.email,telephone:v.telephone},d.client,d.email,d.telephone))}
function lotVente(d){const p=prod(d.produitId);const R=S.reglages||{};const t=n(R.lotBundleTaille)||3,rm=n(R.lotBundleRemise);if(!isBundle(p)||!(rm>0))return 0;return Math.min(Math.floor(Math.max(1,n(d.quantite)||1)/t)*rm,margeVente(d))}
function sousTotalVente(d){return venteBrut(d)}
/* marge disponible avant le prix plancher, pour cette vente */
function margeVente(d){const p=prod(d.produitId);const pp=p?coutVente(p,d):null;const q=Math.max(1,n(d.quantite)||1);return pp?Math.max(0,r2(venteBrut(d)-pp.plancher*q)):sousTotalVente(d)}
function checkCode(d){
  const site=current&&current.orig&&current.orig.origine==="site";const edit=current&&current.orig&&current.orig.codePromo;
  const code=normCode(d.codePromo);
  if(code&&d.cagnotteCode)return{err:"Pas de cumul : soit le code d'une ambassadrice, soit la cagnotte."};
  if(!code)return{};
  const c=(S.codes||[]).find(x=>x.id===code);
  if(!c)return{err:"Code inconnu : "+code+"."};
  if(c.actif===false&&!edit)return{err:"Le code "+code+" est désactivé."};
  if(estTitulaire(c,d.client,d.email,d.telephone))return{err:"C'est le code de "+(c.cliente||"cette ambassadrice")+" : elle ne peut pas l'utiliser pour elle-même."};
  const T=tauxAmb(c);
  if(!site&&!edit&&sousTotalVente(d)<T.min)return{err:"Ce code demande un achat d'au moins "+eur(T.min)+" (ici "+eur(sousTotalVente(d))+")."};
  if(!site&&dejaParrainee(d,current&&current.id))return{err:(d.client||"Cette cliente")+" a déjà profité d'un code d'ambassadrice : c'est une fois par cliente."};
  return{ok:true,c,T,remise:Math.min(r2(sousTotalVente(d)*T.pf/100),margeVente(d))};
}
function setRemise(d,want){const el=$("#remise");if(!el)return;const rp=n(d.remisePrix);if(el.value===""||n(el.value)===r2(n(current.autoRemise)+rp)){const v=r2(want+rp);el.value=String(v).replace(".",",");d.remise=v}current.autoRemise=want}

function remisePrixSet(rpu){const q=Math.max(1,n(($("#quantite")||{}).value)||1);const eu=$("#remisePrixU"),et=$("#remisePrix"),er=$("#remise");if(!eu||!et||!er)return;
  const old=n(et.value),neu=r2(n(rpu)*q);eu.value=rpu?String(r2(rpu)):"";et.value=neu?String(neu):"";const v=r2(Math.max(0,n(er.value)-old+neu));er.value=v?String(v).replace(".",","):""}
function prixSousBase(){if(!current||current.col!=="ventes")return;const el=$("#prixTTC");const base=current.autoPrix;if(!el||!(base>0))return;const v=n(el.value);
  if(v>0&&v<base){const rpu=r2(n(($("#remisePrixU")||{}).value)+base-v);el.value=String(base).replace(".",",");remisePrixSet(rpu);toast("Vendu "+eur(v)+" au lieu de "+eur(base)+" : la différence ("+eur(r2(base-v))+" par pièce) est comptée en remise.")}
  livePreview()}
function pvCode(d){
  const box=$("#pvCode");if(!box)return;const out=[];const amb=ambDe(d.client,d.email,d.telephone);
  const st=amb?etatAmb(amb,current&&current.id):null;

  if(d.cagnotteCode&&amb){const want=Math.min(st.solde,margeVente(d));setRemise(d,want);out.push(`<span>Cagnotte utilisée : remise <b class="num">${eur(want)}</b>${want<st.solde?` (le reste, ${eur(r2(st.solde-want))}, est gardé)`:""}.</span>`)}

function codeAuto(nom){const m=nomSimple(nom).replace(/[^a-z ]/g,"").split(" ").filter(Boolean);const pre=((m[0]||"").slice(0,2)+((m[1]||"").slice(0,2)||"EC")).toUpperCase()||"EUGC";const pris=new Set((S.codes||[]).map(c=>c.id));
  for(let i=0;i<500;i++){const c=pre+String(Math.floor(Math.random()*10000)).padStart(4,"0");if(!pris.has(c))return c}return pre+Date.now().toString().slice(-6)}

/* ---------- exercice, encaissements ---------- */
function inExercice(d){const s=soc();return d&&d>=s.debutExercice&&d<=s.finExercice}
function encaissements(v){
  const out=[];const t=venteTotal(v);const av=v.avanceType&&v.avanceType!=="Aucune"?n(v.avanceMontant):0;
  if(v.statut==="Payée"){if(av){out.push({d:v.avanceDate||v.date,m:av});out.push({d:v.dateEncaissement||v.date,m:r2(t-av)})}else out.push({d:v.dateEncaissement||v.date,m:t})}
  else if(v.statut==="En attente de paiement"||(v.statut==="Annulée"&&v.avanceType==="Arrhes")){if(av)out.push({d:v.avanceDate||v.date,m:av})}
  return out;
}
function mouvementsArgent(){
  const L2=[];
  for(const f of S.financement){const s=L.natures[f.nature]||1;L2.push({d:f.date,m:s*n(f.montant),k:s>0?"Apports et emprunts":"Remboursements et impôts"})}
  for(const v of S.ventes)for(const e of encaissements(v))L2.push({d:e.d,m:e.m,k:"Ventes encaissées"});
  for(const d of S.depenses)if(d.datePaiement)L2.push({d:d.datePaiement,m:-n(d.montant),k:"Dépenses"});
  for(const a of S.achats)if(a.datePaiement)L2.push({d:a.datePaiement,m:-achatTotal(a),k:"Achats de marchandises"});
  for(const a of S.abonnements)for(const k of (a.mois||[])){const j=String(Math.min(28,n(a.jour)||1)).padStart(2,"0");L2.push({d:k+"-"+j,m:-aboMontant(a,k),k:"Abonnements"})}
  return L2;
}

function pubUrl(path){return path?sb.storage.from("site").getPublicUrl(path).data.publicUrl:""}
async function uploadSite(file){
  const type=file.type||"";if(!/^image\/|^video\//.test(type))throw{code:"unsupported_type"};
  if(file.size>50*1024*1024)throw{code:"too_large"};
  const ext=(file.name.split(".").pop()||type.split("/")[1]||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=(type.startsWith("video/")?"videos/":"photos/")+crypto.randomUUID()+"."+ext;
  const{error}=await sb.storage.from("site").upload(path,file,{contentType:type,cacheControl:"31536000",upsert:false});
  if(error)throw{code:"upload_failed",message:error.message};return path;
}
function mediaThumb(path,i,group){const u=pubUrl(path);const vid=/^videos\//.test(path);

async function sendAnnonce(b){
  const sujet=$("#an_sujet").value.trim(),texte=$("#an_texte").value.trim(),eb=$("#formErr"),pg=$("#anProg");
  if(!sujet||texte.length<10){eb.textContent="Écris l'objet et le message.";eb.hidden=false;return}
  const L2=listeAttente().filter(d=>!d.annonceLe&&current.ids.includes(d.id));const MAX=95;
  b.disabled=true;eb.hidden=true;pg.hidden=false;let ok=0,ko=0;
  for(const d of L2.slice(0,MAX)){
    pg.textContent=`Envoi ${ok+ko+1} sur ${Math.min(L2.length,MAX)}…`;
    const prenom=String(d.nom||"").trim().split(" ")[0]||"";
    try{await sendMail({to:d.email,subject:sujet,text:texte.replace(/\{pr[ée]nom\}/gi,prenom).replace(/Bonjour ,/,"Bonjour,"),demandeId:d.id});
      const le=new Date().toISOString();const same=(S.demandes||[]).filter(x=>x.type==="liste"&&String(x.email||"").toLowerCase()===String(d.email).toLowerCase());
      for(const x of same){x.annonceLe=le;try{await db.collection("demandes").doc(x.id).update({annonceLe:le,statut:"Traitée",traiteLe:le})}catch(_){}}
      ok++}
    catch(e){ko++;if(e&&e.code==="non_configure"){eb.textContent="L'envoi d'e-mails depuis l'app n'est pas activé.";eb.hidden=false;break}}

  }
  const rest=listeAttente().filter(d=>!d.annonceLe).length;
  pg.textContent=`${ok} e-mail${ok>1?"s":""} envoyé${ok>1?"s":""}${ko?`, ${ko} en échec`:""}.${rest?` Il en reste ${rest} : ${L2.length>MAX?"l'offre gratuite d'envoi est limitée à 100 e-mails par jour, reprends demain. ":""}les personnes déjà prévenues ne recevront rien une deuxième fois.`:" Tout le monde est prévenu."}`;
  b.disabled=false;b.textContent=rest?"Continuer l'envoi":"Fermer";if(!rest)b.dataset.act="close";else current.ids=listeAttente().filter(d=>!d.annonceLe).map(d=>d.id);render();
}

  if(d.statut!=="Envoyé"){try{await db.collection("devis").doc(id).update({statut:"Envoyé",envoyeLe:new Date().toISOString()});d.statut="Envoyé"}catch(e){toast(dbErr(e));return}}
  const url=devisLien(d);const prenom=(d.client||"").split(" ")[0];
  const txt=`Bonjour ${prenom},\n\nVoici votre devis EUGCEO ${d.numero} (${eur(devisTotal(d))}). Vous pouvez le consulter et l'accepter ici :\n${url}\n\nÀ très vite,\nEUGCEO`;
  const canMail=!!d.email;
  S.dvShare={id,html:`<div class="list" style="padding:12px;gap:10px;display:flex;flex-direction:column"><b>Envoyer le lien à ${esc(d.client)}</b>
    ${navigator.share?`<button class="btn" data-act="dv-share">Partager (WhatsApp, SMS…)</button>`:""}
    ${canMail?`<button class="btn ghost" data-act="dv-mail" data-id="${esc(id)}">Envoyer par e-mail</button>`:""}
    ${d.telephone?`<a class="btn ghost" href="https://wa.me/${esc(waNum(d.telephone))}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">WhatsApp</a><a class="btn ghost" href="sms:${esc(d.telephone.replace(/\s/g,""))}?&body=${encodeURIComponent(txt)}">SMS</a>`:""}
    <button class="linkbtn" data-act="dv-copy">Copier le lien</button>
    <span class="hint" style="overflow-wrap:anywhere">${esc(url)}</span></div>`};
  window.__dvShare={title:"Devis EUGCEO "+d.numero,text:txt,url};

}
function waNum(t){let x=String(t).replace(/[^\d+]/g,"");if(x.startsWith("+"))return x.slice(1);if(x.startsWith("00"))return x.slice(2);if(x.startsWith("0"))return"33"+x.slice(1);return x}
async function devisStatut(id,st){try{await db.collection("devis").doc(id).update({statut:st,modifieLe:new Date().toISOString()});toast("Devis : "+st.toLowerCase())}catch(e){toast(dbErr(e))}}

/* ---------- e-mails (réponses, devis) ---------- */
async function sendMail(o){
  const{data,error}=await sb.functions.invoke("envoyer-email",{body:o});
  if(error){let msg="";try{msg=(await error.context.json()).error||""}catch(_){}throw{code:msg||"envoi"}}
  if(data&&data.error)throw{code:data.error};return data;
}
function mailtoUrl(to,subject,body){return"mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body)}

/* ---------- transformer une pièce ---------- */
const TRANSFO_OUT="Transformation (sortie)",TRANSFO_IN="Transformation (entrée)";
function openTransfo(id){
  const p=prod(id);if(!p)return;const q=stockQty(p);
  if(!(q>0)){toast("Plus aucune pièce en stock pour cette fiche.");return}
  current={col:"transfo",id,orig:p};
  const L2=refModeles().map(m=>m.nom),colors=refCouleurs().map(c=>c.nom);
  const sh=$("#sheet");
  sh.innerHTML=`<div class="sheet-head"><div class="wrap"><button class="linkbtn" data-act="tf-back" data-id="${esc(id)}">‹ Retour</button><h2>Transformer une pièce</h2><button class="linkbtn" data-act="tf-save">Valider</button></div></div>
  <div class="wrap"><form class="f" id="tfForm" novalidate>
   <p class="note">Une pièce de <b>${esc(p.code)}</b> (${q} en stock) devient une nouvelle référence. Les autres pièces ne changent pas. La pièce garde son coût d'achat (${eur(r2(coutMoyen(p)))}).</p>
   <p class="note">Change seulement ce qui est différent après la transformation.</p>
   ${F("modele","Modèle",inp("modele",p.modele,'list="dlMod2" autocomplete="off"'))}<datalist id="dlMod2">${L2.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
   ${F("construction","Construction",sel("construction",L.constructions,p.construction,"—"))}
   <div class="two">${F("laceTaille","Taille de lace",sel("laceTaille",L.laceTailles,p.laceTaille,"Pas de lace"))}${F("laceQualite","Qualité de lace",sel("laceQualite",L.laceQualites,p.laceQualite,"—"))}</div>
   <div class="two">${F("longueur","Longueur (pouces)",inp("longueur",p.longueur,'inputmode="numeric"'))}${F("densite","Densité (%)",money("densite",p.densite?(n(p.densite)<10?n(p.densite)*100:n(p.densite)):""))}</div>
   ${F("cheveux","Qualité de cheveux",sel("cheveux",L.cheveux,p.cheveux,"—"))}
   ${F("couleur","Couleur",inp("couleur",p.couleur,'list="dlCol2" autocomplete="off"'),"Si la couleur n'existe pas, ajoute-la d'abord dans le Référentiel pour avoir un code propre.")}<datalist id="dlCol2">${colors.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
   ${F("tf_travaux","Ce qui a été fait",`<textarea id="tf_travaux" rows="2" placeholder="ex. coupe 12″ → 10″, coloration rouge et noir"></textarea>`)}
   ${F("tf_date","Date",`<input id="tf_date" type="date" value="${today()}">`)}
   <div class="preview" id="pvTf"></div>
   <p class="err" id="formErr" hidden></p>
   <button class="btn" type="submit">Valider la transformation</button>
   <p class="note">Le temps de travail et les produits utilisés se comptent au moment de la vente, dans la fiche de création, comme d'habitude.</p>
  </form></div>`;
  sh.hidden=false;document.body.style.overflow="hidden";sh.scrollTop=0;tfPreview();
}
function tfData(){
  const p=current.orig;const d={};
  for(const k of["modele","construction","laceTaille","laceQualite","longueur","densite","cheveux","couleur"]){const e=$("#tfForm #"+k);d[k]=e?e.value.trim():p[k]}
  d.densite=d.densite===""?"":n(d.densite);if(n(d.densite)>=10)d.densite=n(d.densite)/100;
  return d;
}
function tfPreview(){const b=$("#pvTf");if(!b||!current||current.col!=="transfo")return;const d=tfData();const base=baseCode({...current.orig,...d,type:"Marchandise"});
  const ex=S.produits.find(x=>x.id!==current.id&&x.code===base);
  b.innerHTML=base===current.orig.code?`<span class="err">Rien n'a changé : modifie au moins une caractéristique.</span>`:`<span>Nouvelle référence</span><span class="code">${esc(base)}</span><span>${esc(designation({...current.orig,...d}))}</span>${ex?`<span>Cette référence existe déjà${ex.statut==="Archivé"?" (archivée, elle sera réactivée)":""} : la pièce y sera ajoutée.</span>`:""}`}
async function saveTransfo(){
  const p=current.orig;const d=tfData();const eb=$("#formErr");
  const date=$("#tf_date").value||today();const trav=$("#tf_travaux").value.trim();
  const nouv={...p,...d,type:"Marchandise"};const base=baseCode(nouv);
  if(!d.modele){eb.textContent="Il manque le modèle.";eb.hidden=false;return}
  if(base===p.code){eb.textContent="Rien n'a changé : modifie au moins une caractéristique.";eb.hidden=false;return}
  if(!(stockQty(p)>0)){eb.textContent="Plus aucune pièce en stock pour cette fiche.";eb.hidden=false;return}
  const btns=document.querySelectorAll('[data-act="tf-save"],#tfForm .btn[type=submit]');btns.forEach(b=>b.disabled=true);
  const now=new Date().toISOString();const cout=r2(coutMoyen(p));
  try{
    let target=S.produits.find(x=>x.id!==p.id&&x.code===base);let tid;
    if(target){tid=target.id;if(target.statut==="Archivé")await db.collection("produits").doc(tid).update({statut:"Actif",modifieLe:now})}
    else{
      const body={modele:d.modele,construction:d.construction,laceTaille:d.laceTaille,laceQualite:d.laceQualite,longueur:d.longueur,densite:d.densite,cheveux:d.cheveux,couleur:d.couleur,
        type:"Marchandise",prixAchat:cout,seuil:0,stockDepart:0,statut:"Actif",code:"",origine:{produitId:p.id,code:p.code,date,travaux:trav},creeLe:now,modifieLe:now,excel:"nouveau"};
      if(myId)body.par=myId;body.code=codeFor(body,null,"");
      const ref=db.collection("produits").doc();await ref.set(body);tid=ref.id;S.produits.push({id:tid,...body});target={id:tid,...body};
    }
    const lien=crypto.randomUUID();
    await db.collection("mouvements").doc().set({date,produitId:p.id,motif:TRANSFO_OUT,quantite:1,commentaire:"Transformée en "+target.code+(trav?" : "+trav:""),lienTransfo:lien,versProduitId:tid,creeLe:now,modifieLe:now,par:myId||"",excel:"nouveau"});
    await db.collection("mouvements").doc().set({date,produitId:tid,motif:TRANSFO_IN,quantite:1,commentaire:"Issue de "+p.code+(trav?" : "+trav:""),lienTransfo:lien,deProduitId:p.id,coutUnitaire:cout,creeLe:now,modifieLe:now,par:myId||"",excel:"nouveau"});
    closeSheet(true);toast("Pièce transformée : "+target.code);openForm("produits",tid);
  }catch(e){btns.forEach(b=>b.disabled=false);eb.textContent=dbErr(e);eb.hidden=false}
}
function transfoBloc(p){
  const outs=S.mouvements.filter(m=>m.produitId===p.id&&(m.motif===TRANSFO_OUT||m.motif===TRANSFO_IN));
  const orig=p.origine&&p.origine.produitId?prod(p.origine.produitId):null;
  const lines=[];
  if(p.origine&&p.origine.code)lines.push(`<span>Issue de <button type="button" class="linkbtn" data-act="edit" data-col="produits" data-id="${esc(p.origine.produitId)}">${esc(p.origine.code)}</button> le ${dfr(p.origine.date)}${p.origine.travaux?" · "+esc(p.origine.travaux):""}</span>`);
  for(const m of outs.filter(m=>m.motif===TRANSFO_OUT)){const t=prod(m.versProduitId);lines.push(`<span>${dfr(m.date)} : 1 pièce transformée en ${t?`<button type="button" class="linkbtn" data-act="edit" data-col="produits" data-id="${esc(t.id)}">${esc(t.code)}</button>`:"une autre référence"}</span>`)}
  for(const m of outs.filter(m=>m.motif===TRANSFO_IN&&!(p.origine&&p.origine.produitId===m.deProduitId))){const t=prod(m.deProduitId);lines.push(`<span>${dfr(m.date)} : 1 pièce reçue de ${t?`<button type="button" class="linkbtn" data-act="edit" data-col="produits" data-id="${esc(t.id)}">${esc(t.code)}</button>`:"une autre référence"}</span>`)}
  const can=db&&canWrite&&!isPrestation(p)&&p.statut!=="Archivé"&&stockQty(p)>0;
  if(!lines.length&&!can)return"";
  return`<fieldset><legend>Transformations</legend>${lines.join("")||`<p class="note">Aucune transformation.</p>`}
   ${can?`<button type="button" class="btn ghost" data-act="tf-open" data-id="${esc(p.id)}">Transformer une pièce</button><span class="hint">Coupe, couleur, modèle… : une pièce passe dans une nouvelle référence, avec son coût d'achat. Les autres pièces ne changent pas.</span>`:""}</fieldset>`;
}

/* ---------- pages de gestion ---------- */
function pageHead(t,sub){const r=["societe","referentiel","controles","site","demandes","rdvreglages"].includes(S.page);return`<div class="pagehead noprint"><button class="linkbtn back" data-act="page" data-p="${r?"reglages":""}">‹ ${r?"Réglages":"Retour"}</button></div><div><h2 class="ptitle">${esc(t)}</h2>${sub?`<p class="note">${sub}</p>`:""}</div>`}
function table(head,rows,foot){return`<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")||`<tr><td colspan="${head.length}" class="muted">Rien pour l'instant.</td></tr>`}</tbody>${foot?`<tfoot>${foot}</tfoot>`:""}</table></div>`}

function pResultat(){
  const s=soc();let ca=0,caM=0,caP=0,cmv=0,arrhes=0;const charges={};
  for(const v of S.ventes){if(!inExercice(v.date))continue;
    if(dansCA(v)){const t=venteTotal(v);ca+=t;const p=prod(v.produitId);if(p&&isPrestation(p))caP+=t;else{caM+=t;if(p)cmv+=Math.max(1,n(v.quantite)||1)*coutMoyen(p)}}
    else if(v.statut==="Annulée"&&v.avanceType==="Arrhes")arrhes+=n(v.avanceMontant)}
  for(const d of S.depenses)if(inExercice(d.date)){const c=d.categorie||"Autres charges";charges[c]=(charges[c]||0)+n(d.montant)}
  for(const a of S.abonnements)for(const k of (a.mois||[]))if(inExercice(k+"-15")){const c=a.categorie||"Autres charges";charges[c]=(charges[c]||0)+aboMontant(a,k)}
  const totCh=Object.values(charges).reduce((x,y)=>x+y,0);
  const res=r2(ca+arrhes-cmv-totCh);
  const is=res>0?r2(Math.min(res,n(s.isPlafond))*n(s.isTauxReduit)+Math.max(0,res-n(s.isPlafond))*n(s.isTauxNormal)):0;
  const line=(l,v,cls)=>`<tr class="${cls||""}"><td>${l}</td><td class="r num">${eur(v)}</td></tr>`;
  return`${pageHead("Résultat de l'exercice","Du "+dfr(s.debutExercice)+" au "+dfr(s.finExercice)+". Montants sans TVA (franchise).")}
  <div class="tbl-wrap"><table class="tbl">
   <tbody>
    <tr class="grp"><td colspan="2">Produits</td></tr>
    ${line("Ventes de perruques et produits",caM)}${line("Prestations",caP)}${arrhes?line("Arrhes gardées (ventes annulées)",arrhes):""}
    ${line("Total des produits",ca+arrhes,"sub")}
    <tr class="grp"><td colspan="2">Charges</td></tr>
    ${line("Coût des pièces vendues",cmv)}
    ${Object.entries(charges).sort((a,b)=>b[1]-a[1]).map(([k,v])=>line(esc(k),v)).join("")}
    ${line("Total des charges",cmv+totCh,"sub")}
   </tbody>
   <tfoot>${line("Résultat avant impôt",res,"tot "+(res<0?"neg":"pos"))}${line("Impôt sur les sociétés estimé",is)}${line("Résultat après impôt (estimé)",res-is,"tot")}</tfoot>
  </table></div>
  <p class="note">Estimation de gestion, pas des comptes officiels. Le coût des pièces vendues utilise le coût moyen d'achat. L'impôt est calculé à ${String(n(s.isTauxReduit)*100).replace(".",",")} % jusqu'à ${eur(n(s.isPlafond))}, puis ${String(n(s.isTauxNormal)*100).replace(".",",")} % (taux réduit PME, sous conditions).</p>`;
}
function pTresorerie(){
  const s=soc();const mv=mouvementsArgent().filter(x=>x.d);
  let start=ym(s.debutExercice);const end=ym(today())>ym(s.finExercice)?ym(s.finExercice):ym(today());
  const months=[];let k=start;while(k<=end&&months.length<60){months.push(k);k=addMonths(k,1)}
  let solde=n(s.banqueDebut);const before=mv.filter(x=>ym(x.d)<start).reduce((a,x)=>a+x.m,0);solde+=before;
  const rows=months.map(m=>{const ins=mv.filter(x=>ym(x.d)===m&&x.m>0).reduce((a,x)=>a+x.m,0);const outs=mv.filter(x=>ym(x.d)===m&&x.m<0).reduce((a,x)=>a+x.m,0);solde+=ins+outs;
    return`<tr><td class="cap">${esc(monthName(m))}</td><td class="r num pos">${ins?eur(ins):"—"}</td><td class="r num">${outs?eur(-outs):"—"}</td><td class="r num"><b>${eur(solde)}</b></td></tr>`});
  const cats={};for(const x of mv.filter(x=>ym(x.d)>=start)){cats[x.k]=(cats[x.k]||0)+x.m}
  return`${pageHead("Trésorerie","Argent entré et sorti mois par mois, d'après les dates de paiement.")}
  ${table(["Mois","Entrées","Sorties","Solde"],rows)}
  <h3>Par nature, depuis le début</h3>
  ${table(["Nature","Montant"],Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r num ${v>0?"pos":""}">${eur(v)}</td></tr>`))}
  <p class="note">Le solde doit correspondre au relevé Qonto. S'il y a un écart, il manque un paiement ou une date de paiement.</p>`;
}
function pTva(){
  const y=today().slice(0,4);let m=0,p=0;
  for(const v of S.ventes){if(!dansCA(v)||(v.date||"").slice(0,4)!==y)continue;const pr=prod(v.produitId);if(pr&&isPrestation(pr))p+=venteTotal(v);else m+=venteTotal(v)}
  const bar=(val,seuil,maj)=>{const pc=Math.min(100,val/maj*100);const st=val>maj?"bad":val>seuil?"warn":"ok";return`<div class="gauge"><div class="gfill ${st}" style="width:${pc}%"></div><div class="gmark" style="left:${seuil/maj*100}%"></div></div>`};

function controles(){
  const out=[];const t=today();const s=soc();
  const ago=(d,days)=>{if(!d)return false;const x=new Date(d);return (Date.now()-x.getTime())/864e5>days};
  for(const k of ["siren","adresse","cpVille","president"])if(!s[k]){out.push({lvl:"warn",t:"Paramètres de la société incomplets",s:"Il manque des informations obligatoires sur les factures.",act:"societe"});break}
  for(const v of S.ventes){
    if(v.statut==="En attente de paiement"&&ago(v.date,30))out.push({lvl:"warn",t:"Vente en attente depuis plus de 30 jours",s:esc(v.client)+" · "+dfr(v.date)+" · reste "+eur(venteReste(v)),col:"ventes",id:v.id});
    if(dansCA(v)&&n(v.plancher)&&(venteBrut(v)-n(v.remise))/Math.max(1,n(v.quantite)||1)<n(v.plancher))out.push({lvl:"warn",t:"Vente sous le prix plancher",s:esc(v.client)+" · "+dfr(v.date),col:"ventes",id:v.id});
    if(v.statut==="Payée"&&!v.dateEncaissement)out.push({lvl:"info",t:"Vente payée sans date d'encaissement",s:esc(v.client)+" · "+dfr(v.date),col:"ventes",id:v.id});
  }
  for(const d of S.depenses)if(!d.justificatif&&!d.commentaire)out.push({lvl:"info",t:"Dépense sans justificatif",s:esc(d.fournisseur)+" · "+dfr(d.date)+" · "+eur(n(d.montant)),col:"depenses",id:d.id});
  for(const a of S.achats){if(!a.dateReception&&ago(a.date,30))out.push({lvl:"warn",t:"Achat pas encore reçu après 30 jours",s:esc(a.fournisseur)+" · "+dfr(a.date),col:"achats",id:a.id});}
  for(const x of [...S.achats.map(a=>({...a,_c:"achats",_m:achatTotal(a),_t:"Achat"})),...S.depenses.map(d=>({...d,_c:"depenses",_m:n(d.montant),_t:"Dépense"}))]){
    if(x.datePaiement||!x.echeance||!x._m)continue;const j=Math.round((new Date(x.echeance)-new Date(t))/864e5);
    if(j<0)out.push({lvl:"bad",t:x._t+" en retard de paiement",s:esc(x.fournisseur||"")+" · "+eur(x._m)+" · à payer avant le "+dfr(x.echeance),col:x._c,id:x.id});
    else if(j<=7)out.push({lvl:"warn",t:x._t+" à payer bientôt",s:esc(x.fournisseur||"")+" · "+eur(x._m)+" · avant le "+dfr(x.echeance),col:x._c,id:x.id})}
  for(const p of S.produits){const q=stockQty(p);if(q!==null&&q<0)out.push({lvl:"bad",t:"Stock négatif",s:esc(p.code)+" : "+q+" (une vente sans pièce en stock ?)",col:"produits",id:p.id})}
  for(const a of S.abonnements){const cur=ym(t);if(aboOccurrences(a).includes(cur)&&!(a.mois||[]).includes(cur)&&Number(t.slice(8))>n(a.jour)+3)out.push({lvl:"info",t:"Abonnement non pointé ce mois-ci",s:esc(a.fournisseur),page:"frais"})}
  return out;
}
