<title>EUGCEO Gestion</title>

<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout : appli téléphone — en-tête collant, une colonne, barre d'onglets fixe en bas avec bouton central « + ». Charte EUGCEO : noir, crème, bronze, gris. */
:root{
  --bg:#f2eee8; --surface:#fbf9f6; --fg:#111111; --muted:#6f625a; --line:#d9d2ca;
  --accent:#5e4c42; --accent-fg:#f2eee8; --soft:#e7e0d7;
  --ok:#2f6b47; --warn:#9a5b12; --bad:#a3322a;
  --ok-bg:#e1ece4; --warn-bg:#f4e7d3; --bad-bg:#f5dfdc;
  --display:"Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --body:"Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1b1917; --fg:#f2eee8; --muted:#a99c92; --line:#34302c;
  --accent:#c4a796; --accent-fg:#111111; --soft:#26221f;
  --ok:#7fc39a; --warn:#e3a95c; --bad:#ec8a80;
  --ok-bg:#1d2b22; --warn-bg:#30251a; --bad-bg:#33201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1b1917; --fg:#f2eee8; --muted:#a99c92; --line:#34302c;
  --accent:#c4a796; --accent-fg:#111111; --soft:#26221f;
  --ok:#7fc39a; --warn:#e3a95c; --bad:#ec8a80;
  --ok-bg:#1d2b22; --warn-bg:#30251a; --bad-bg:#33201e; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
img{max-width:100%}[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.login-in{display:flex;flex-direction:column;gap:8px;padding-block:48px 32px;max-width:420px}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px}
.login-brand img{border-radius:18px}
.pw{display:flex;align-items:center;gap:6px}.pw input{flex:1}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;gap:6px;align-items:center}
.line.tr{grid-template-columns:minmax(0,1fr) 4.2em auto auto}
.line.tr .trLib{grid-column:1/-1;grid-row:2}
.line.mt{grid-template-columns:minmax(0,1fr) 4.2em auto auto}
.line select,.line input{padding:8px 8px;font-size:15px}
.line .u{color:var(--muted);font-size:13px}
.line .rm{padding:6px;color:var(--muted)}
.addline{align-self:flex-start;padding-left:0}
.login-links{display:flex;flex-direction:column;align-items:center;gap:2px}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;gap:12px;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:600;letter-spacing:.32em;font-size:15px}
h1{font-family:var(--display);font-weight:500;font-size:22px;margin:0;flex:1;text-wrap:balance}
.status{font-size:12px;color:var(--muted)}
main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.num{font-variant-numeric:tabular-nums}
.money-big{font-family:var(--display);font-size:40px;font-weight:600;line-height:1}
.hero{background:var(--fg);color:var(--bg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{color:inherit;opacity:.7}
.hero small{opacity:.75;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:19px;font-weight:600}
.tile span{font-size:12px;color:var(--muted)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar strong{font-family:var(--display);font-size:20px;font-weight:600;text-transform:capitalize}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;width:100%;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .s{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.row .v{font-weight:600;text-align:right;white-space:nowrap}
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:.02em}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;box-sizing:border-box}
.note{font-size:13px;color:var(--muted);margin:0}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-block:6px}
nav.tabs button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button[aria-current="page"]{color:var(--fg);font-weight:600}
nav.tabs .plus{justify-self:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:28px;line-height:1;display:grid;place-items:center;padding:0;margin-top:-18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav.tabs .plus[disabled]{opacity:.35}
/* feuille de saisie */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.sheet-head .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.sheet-head h2{flex:1}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;padding:8px 4px}
form.f{display:flex;flex-direction:column;gap:14px;padding-block:16px 40px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 6px}
details.more{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
details.more summary{cursor:pointer;font-weight:500;font-size:14px}
details.more[open] summary{margin-bottom:12px}
details.more>div{display:flex;flex-direction:column;gap:12px}
.preview{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.preview .code{font-size:14px;font-weight:600;color:var(--fg)}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:13px 18px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer;width:100%}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line)}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:16px}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.choice b{font-family:var(--display);font-size:19px;font-weight:600}
.choice span{font-size:12.5px;color:var(--muted)}
.att{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.att img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.att a{color:var(--accent)}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}
.months{display:flex;flex-wrap:wrap;gap:6px}
.months button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:5px 9px;cursor:pointer;text-transform:capitalize}
.months button[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
@media (max-width:360px){.three{grid-template-columns:1fr 1fr}.money-big{font-size:34px}}
.pagehead{display:flex}
.back{padding-left:0}
.ptitle{font-size:26px}
h3{font-family:var(--display);font-weight:600;font-size:18px;margin:6px 0 0}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl thead th{border-top:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl .r{text-align:right}.tbl .cap{text-transform:capitalize}.tbl .muted{color:var(--muted)}
.tbl tr.grp td{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
.tbl tr.sub td{font-weight:600}.tbl tr.tot td{font-weight:600;font-size:15px}
.tbl .pos{color:var(--ok)}.tbl tr.neg td:last-child{color:var(--bad)}
.tbl input.inv{width:4.5em;text-align:right;padding:6px 8px}
.kv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.kvline{display:flex;justify-content:space-between;gap:10px}
.gauge{position:relative;height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.gfill{height:100%;background:var(--ok)}.gfill.warn{background:var(--warn)}.gfill.bad{background:var(--bad)}
.gmark{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.5}
.line.rf{grid-template-columns:minmax(0,1fr) 5em 4em auto}
.line.rm2{grid-template-columns:minmax(0,1fr) 6em auto}
.line.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.invoice{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:18px;font-size:13px;line-height:1.5}
.inv-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.inv-brand{font-family:var(--display);font-size:26px;letter-spacing:.3em;font-weight:600}
.inv-small{font-size:11.5px;color:#5e4c42}
.inv-meta{text-align:right}.inv-title{font-family:var(--display);font-size:24px;font-weight:600}
.inv-tbl{width:100%;border-collapse:collapse}
.inv-tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5e4c42;border-bottom:1px solid #111;padding:6px 4px;text-align:left}
.inv-tbl td{padding:8px 4px;border-bottom:1px solid #e3ddd6}.inv-tbl tfoot td{border-bottom:0}
.inv-tbl .r{text-align:right}.inv-tbl .num{white-space:nowrap}
.inv-f{border-top:1px solid #e3ddd6;padding-top:10px;font-size:12px}.inv-f p{margin:2px 0}
@media print{
  header.top,nav.tabs,.noprint,.toast,body::before{display:none!important}
  html,body{background:#fff!important}
  main{padding:0!important}.wrap{max-width:none;padding:0!important}
  .invoice{border:0;padding:0}
  @page{margin:16mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand">EUGCEO</span><h1 id="screenTitle">Accueil</h1><span class="status" id="status">Connexion…</span></div></header>

</div></nav>

function baseCode(p){
  if(!p.modele)return"";

  const parts=[mod];
  const cons=(T_CODES[p.construction]||"")+(p.longueur?String(p.longueur):"");
  if(cons)parts.push(cons);
  const taille=p.laceTaille?(T_CODES[p.laceTaille]||String(p.laceTaille).toUpperCase().replace(/\s/g,"")):"";

  const de=n(p.densite);if(de)parts.push(String(Math.round(de<10?de*100:de)));

}

/* ---------- calculs ---------- */
function venteTotal(v){return r2(Math.max(1,n(v.quantite)||1)*n(v.prixTTC)-n(v.remise)+n(v.port))}
function venteEncaisse(v){

function venteReste(v){return v.statut==="En attente de paiement"?r2(venteTotal(v)-venteEncaisse(v)):0}

  for(const v of S.ventes)if(v.produitId===p.id&&v.statut!=="Annulée")q-=Math.max(1,n(v.quantite)||1);

function vStock(){
  if(S.stockFilter==="matieres")return vMatieres();
  const f=S.stockFilter;let list=S.produits.filter(p=>f==="archives"?p.statut==="Archivé":p.statut!=="Archivé");
  const withQ=list.map(p=>({p,q:stockQty(p)}));

function vFrais(){
  const f=S.fraisFilter;const items=[];
  if(f==="tout"||f==="achats")for(const a of S.achats){const p=prod(a.produitId);items.push({d:a.date,html:`<button class="row" data-act="edit" data-col="achats" data-id="${esc(a.id)}"><span class="t">${esc(a.fournisseur||"Achat")}</span><span class="v num">− ${eur(achatTotal(a))}</span><span class="s">${dfr(a.date)} · Achat ${esc(a.ref||"")} · ${n(a.quantite)} × ${esc(p?p.code:"?")} ${a.dateReception?`<span class="chip ok">reçu</span>`:`<span class="chip warn">pas encore reçu</span>`}${a.datePaiement?"":`<span class="chip">non payé</span>`}${exChip(a)}</span></button>`})}
  if(f==="tout"||f==="depenses")for(const d of S.depenses)items.push({d:d.date,html:`<button class="row" data-act="edit" data-col="depenses" data-id="${esc(d.id)}"><span class="t">${esc(d.fournisseur||"Dépense")}</span><span class="v num">− ${eur(n(d.montant))}</span><span class="s">${dfr(d.date)} · ${esc(d.ref?d.ref+" · ":"")}${esc(d.description||d.categorie||"")}${d.datePaiement?"":` <span class="chip">non payée</span>`}${exChip(d)}</span></button>`});
  if(f==="tout"||f==="financement")for(const x of S.financement){const s=L.natures[x.nature]||1;items.push({d:x.date,html:`<button class="row" data-act="edit" data-col="financement" data-id="${esc(x.id)}"><span class="t">${esc(x.description||x.nature)}</span><span class="v num" style="color:${s>0?"var(--ok)":"inherit"}">${s>0?"+":"−"} ${eur(n(x.montant))}</span><span class="s">${dfr(x.date)} · ${esc(x.nature)}${exChip(x)}</span></button>`})}
  items.sort((a,b)=>(b.d||"").localeCompare(a.d||""));
  let body;
  if(f==="abonnements"){
    const cur=ym(today());
    body=S.abonnements.map(a=>{const occ=aboOccurrences(a).slice(-6);
      return`<div class="row" style="cursor:default"><span class="t">${esc(a.fournisseur)} · ${esc(a.description||"")}</span><span class="v num">${eur(n(a.montant))}</span><span class="s">${esc(a.frequence||"Mensuel")}, le ${esc(a.jour||"?")} · ${exChip(a)} <button class="linkbtn" data-act="edit" data-col="abonnements" data-id="${esc(a.id)}">Modifier</button></span>
      <span class="s" style="flex-direction:column;align-items:flex-start"><span>Mois payés (touche pour pointer) :</span><span class="months">${occ.map(k=>`<button data-act="pointer" data-id="${esc(a.id)}" data-k="${k}" aria-pressed="${(a.mois||[]).includes(k)}" ${canWrite&&db?"":"disabled"}>${esc(monthName(k))}${k===cur?" •":""}</button>`).join("")||"<span>début à venir</span>"}</span></span></div>`}).join("");
    body=`<div class="list">${body||`<div class="empty">Aucun abonnement. Touche « + » puis « Abonnement ».</div>`}</div><p class="note">Pointe un mois quand le prélèvement est passé sur le relevé : il compte alors dans la trésorerie et les frais du mois.</p>`;
  } else body=`<div class="list">${items.map(i=>i.html).join("")||`<div class="empty">Rien d'enregistré ici pour l'instant.</div>`}</div>`;
  return`${banner()}${filterBar("fraisFilter",f,[["tout","Tout"],["achats","Achats"],["depenses","Dépenses"],["abonnements","Abonnements"],["financement","Apports"]])}${loadingOr("depenses",body)}`;
}

function prodSelect(id,cur,onlyStock){

function validate(col,d){
  const e=[];
  if(col==="ventes"){if(!d.client)e.push("le nom de la cliente");if(!d.produitId)e.push("le produit");if(!n(d.prixTTC))e.push("le prix");if(d.avanceType!=="Aucune"&&!n(d.avanceMontant))e.push("le montant de l'avance")}
  if(col==="achats"){if(!d.produitId)e.push("le produit");if(!n(d.quantite))e.push("la quantité");if(!n(d.prixUnit))e.push("le prix unitaire");if(d.devise!=="EUR"&&!n(d.taux))e.push("le taux de change")}
  if(col==="depenses"){if(!d.fournisseur)e.push("le fournisseur");if(!d.categorie)e.push("la catégorie");if(!n(d.montant))e.push("le montant")}
  if(col==="produits"){if(!d.modele)e.push("le modèle")}
  if(col==="financement"){if(!n(d.montant))e.push("le montant")}
  if(col==="mouvements"){if(!d.produitId)e.push("le produit");if(!n(d.quantite))e.push("la quantité")}
  if(col==="matieres"){if(!d.nom)e.push("le nom");if(!n(d.prixCond))e.push("le prix payé")}
  if(col==="abonnements"){if(!d.fournisseur)e.push("le fournisseur");if(!n(d.montant))e.push("le montant");if(!d.debut)e.push("la date de début")}
  if(d.date===""&&"date"in d)e.push("la date");
  return e.length?"Il manque "+e.join(", ")+".":"";
}
async function save(){
  if(!current||!db)return;const {col,id,orig}=current;const d=formData();
  const err=validate(col,d);const eb=$("#formErr");
  if(err){eb.textContent=err;eb.hidden=false;return}
  if(col==="produits"){d.type=n(d.prixAchat)===0?"Prestation":"Marchandise";d.code=codeFor(d,id,orig.code);if(n(d.densite)>=10)d.densite=n(d.densite)/100}
  if(col==="ventes"){const p=prod(d.produitId);d.designation=p?designation(p):"";if(d.statut!=="Payée")d.dateEncaissement="";
    const cv=coutVente(p,d);if(cv){d.revient=cv.revient;d.plancher=cv.plancher}if(!orig.numero)d.numero=nextFacture(d.date)}
  if(col==="matieres"){d.contenance=n(d.contenance)||1;d.prix=Math.round(n(d.prixCond)/d.contenance*10000)/10000}
  if(col==="achats"&&!orig.ref)d.ref=nextRef("achats","A-",5);
  if(col==="depenses"&&!orig.ref)d.ref=nextRef("depenses","D-",5);
  const body={...orig,...d};delete body.id;
  body.excel=orig.excel==="ok"?"modifié":(orig.excel||"nouveau");
  body.modifieLe=new Date().toISOString();if(!orig.id){body.creeLe=body.modifieLe;if(myId)body.par=myId}
  const btns=document.querySelectorAll('[data-act="save"],#form .btn[type="submit"]');btns.forEach(b=>b.disabled=true);
  try{
    const ref=id?db.collection(col).doc(id):db.collection(col).doc();
    await ref.set(body);closeSheet();toast(orig.id?"Modifié":"Enregistré");
  }catch(e){btns.forEach(b=>b.disabled=false);eb.textContent=dbErr(e);eb.hidden=false;if(e&&e.code==="invalid_argument"){canWrite=false;render()}}
}
async function del(btn){

  if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.textContent="Confirmer la suppression";return}
  const {col,id,orig}=current;
  try{
    if(orig.excel==="ok"||orig.excel==="modifié")await db.collection("suppressions").add({collection:col,ref:orig.ref||"",resume:(orig.code||orig.client||orig.fournisseur||orig.description||""),date:new Date().toISOString(),par:myId||""});
    await db.collection(col).doc(id).delete();closeSheet();toast("Supprimé");
  }catch(e){const eb=$("#formErr");eb.textContent=dbErr(e);eb.hidden=false}
}
function dbErr(e){const c=e&&e.code;

  return"Impossible d'enregistrer pour le moment. Réessaie.";}

  debutExercice:"2026-10-12",finExercice:"2027-12-31",banqueDebut:0,tva:"Non",tauxTva:0.2,isTauxReduit:0.15,isPlafond:42500,isTauxNormal:0.25,
  conditions:"Paiement à réception de la facture.",mention:""};

/* ---------- numérotation ---------- */
function nextRef(col,prefix,digits){let max=0;for(const x of S[col]){const m=String(x.ref||x.numero||"").match(new RegExp("^"+prefix.replace(/[-]/g,"\\-")+"(\\d+)$"));if(m)max=Math.max(max,Number(m[1]))}return prefix+String(max+1).padStart(digits,"0")}
function nextFacture(date){const y=(date||today()).slice(0,4);return nextRef("ventes","EC-"+y+"-",3)}

/* ---------- exercice, encaissements ---------- */
function inExercice(d){const s=soc();return d&&d>=s.debutExercice&&d<=s.finExercice}
function encaissements(v){
  const out=[];const t=venteTotal(v);const av=v.avanceType&&v.avanceType!=="Aucune"?n(v.avanceMontant):0;
  if(v.statut==="Payée"){if(av){out.push({d:v.avanceDate||v.date,m:av});out.push({d:v.dateEncaissement||v.date,m:r2(t-av)})}else out.push({d:v.dateEncaissement||v.date,m:t})}
  else if(v.statut==="En attente de paiement"||(v.statut==="Annulée"&&v.avanceType==="Arrhes")){if(av)out.push({d:v.avanceDate||v.date,m:av})}
  return out;
}
function mouvementsArgent(){
  const L2=[];
  for(const f of S.financement){const s=L.natures[f.nature]||1;L2.push({d:f.date,m:s*n(f.montant),k:s>0?"Apports et emprunts":"Remboursements et impôts"})}
  for(const v of S.ventes)for(const e of encaissements(v))L2.push({d:e.d,m:e.m,k:"Ventes encaissées"});
  for(const d of S.depenses)if(d.datePaiement)L2.push({d:d.datePaiement,m:-n(d.montant),k:"Dépenses"});
  for(const a of S.achats)if(a.datePaiement)L2.push({d:a.datePaiement,m:-achatTotal(a),k:"Achats de marchandises"});
  for(const a of S.abonnements)for(const k of (a.mois||[])){const j=String(Math.min(28,n(a.jour)||1)).padStart(2,"0");L2.push({d:k+"-"+j,m:-n(a.montant),k:"Abonnements"})}
  return L2;
}

/* ---------- pages de gestion ---------- */
function pageHead(t,sub){return`<div class="pagehead noprint"><button class="linkbtn back" data-act="page" data-p="">‹ Retour</button></div><div><h2 class="ptitle">${esc(t)}</h2>${sub?`<p class="note">${sub}</p>`:""}</div>`}
function table(head,rows,foot){return`<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")||`<tr><td colspan="${head.length}" class="muted">Rien pour l'instant.</td></tr>`}</tbody>${foot?`<tfoot>${foot}</tfoot>`:""}</table></div>`}

function pResultat(){
  const s=soc();let ca=0,caM=0,caP=0,cmv=0,arrhes=0;const charges={};
  for(const v of S.ventes){if(!inExercice(v.date))continue;
    if(dansCA(v)){const t=venteTotal(v);ca+=t;const p=prod(v.produitId);if(p&&isPrestation(p))caP+=t;else{caM+=t;if(p)cmv+=Math.max(1,n(v.quantite)||1)*coutMoyen(p)}}
    else if(v.statut==="Annulée"&&v.avanceType==="Arrhes")arrhes+=n(v.avanceMontant)}
  for(const d of S.depenses)if(inExercice(d.date)){const c=d.categorie||"Autres charges";charges[c]=(charges[c]||0)+n(d.montant)}
  for(const a of S.abonnements)for(const k of (a.mois||[]))if(inExercice(k+"-15")){const c=a.categorie||"Autres charges";charges[c]=(charges[c]||0)+n(a.montant)}
  const totCh=Object.values(charges).reduce((x,y)=>x+y,0);
  const res=r2(ca+arrhes-cmv-totCh);
  const is=res>0?r2(Math.min(res,n(s.isPlafond))*n(s.isTauxReduit)+Math.max(0,res-n(s.isPlafond))*n(s.isTauxNormal)):0;
  const line=(l,v,cls)=>`<tr class="${cls||""}"><td>${l}</td><td class="r num">${eur(v)}</td></tr>`;
  return`${pageHead("Résultat de l'exercice","Du "+dfr(s.debutExercice)+" au "+dfr(s.finExercice)+". Montants sans TVA (franchise).")}
  <div class="tbl-wrap"><table class="tbl">
   <tbody>
    <tr class="grp"><td colspan="2">Produits</td></tr>
    ${line("Ventes de perruques et produits",caM)}${line("Prestations",caP)}${arrhes?line("Arrhes gardées (ventes annulées)",arrhes):""}
    ${line("Total des produits",ca+arrhes,"sub")}
    <tr class="grp"><td colspan="2">Charges</td></tr>
    ${line("Coût des pièces vendues",cmv)}
    ${Object.entries(charges).sort((a,b)=>b[1]-a[1]).map(([k,v])=>line(esc(k),v)).join("")}
    ${line("Total des charges",cmv+totCh,"sub")}
   </tbody>
   <tfoot>${line("Résultat avant impôt",res,"tot "+(res<0?"neg":"pos"))}${line("Impôt sur les sociétés estimé",is)}${line("Résultat après impôt (estimé)",res-is,"tot")}</tfoot>
  </table></div>
  <p class="note">Estimation de gestion, pas des comptes officiels. Le coût des pièces vendues utilise le coût moyen d'achat. L'impôt est calculé à ${String(n(s.isTauxReduit)*100).replace(".",",")} % jusqu'à ${eur(n(s.isPlafond))}, puis ${String(n(s.isTauxNormal)*100).replace(".",",")} % (taux réduit PME, sous conditions).</p>`;
}
function pTresorerie(){
  const s=soc();const mv=mouvementsArgent().filter(x=>x.d);
  let start=ym(s.debutExercice);const end=ym(today())>ym(s.finExercice)?ym(s.finExercice):ym(today());
  const months=[];let k=start;while(k<=end&&months.length<60){months.push(k);k=addMonths(k,1)}
  let solde=n(s.banqueDebut);const before=mv.filter(x=>ym(x.d)<start).reduce((a,x)=>a+x.m,0);solde+=before;
  const rows=months.map(m=>{const ins=mv.filter(x=>ym(x.d)===m&&x.m>0).reduce((a,x)=>a+x.m,0);const outs=mv.filter(x=>ym(x.d)===m&&x.m<0).reduce((a,x)=>a+x.m,0);solde+=ins+outs;
    return`<tr><td class="cap">${esc(monthName(m))}</td><td class="r num pos">${ins?eur(ins):"—"}</td><td class="r num">${outs?eur(-outs):"—"}</td><td class="r num"><b>${eur(solde)}</b></td></tr>`});
  const cats={};for(const x of mv.filter(x=>ym(x.d)>=start)){cats[x.k]=(cats[x.k]||0)+x.m}
  return`${pageHead("Trésorerie","Argent entré et sorti mois par mois, d'après les dates de paiement.")}
  ${table(["Mois","Entrées","Sorties","Solde"],rows)}
  <h3>Par nature, depuis le début</h3>
  ${table(["Nature","Montant"],Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r num ${v>0?"pos":""}">${eur(v)}</td></tr>`))}
  <p class="note">Le solde doit correspondre au relevé Qonto. S'il y a un écart, il manque un paiement ou une date de paiement.</p>`;
}

function controles(){
  const out=[];const t=today();const s=soc();
  const ago=(d,days)=>{if(!d)return false;const x=new Date(d);return (Date.now()-x.getTime())/864e5>days};
  for(const k of ["siren","adresse","cpVille","president"])if(!s[k]){out.push({lvl:"warn",t:"Paramètres de la société incomplets",s:"Il manque des informations obligatoires sur les factures.",act:"societe"});break}
  for(const v of S.ventes){
    if(v.statut==="En attente de paiement"&&ago(v.date,30))out.push({lvl:"warn",t:"Vente en attente depuis plus de 30 jours",s:esc(v.client)+" · "+dfr(v.date)+" · reste "+eur(venteReste(v)),col:"ventes",id:v.id});
    if(dansCA(v)&&n(v.plancher)&&(Math.max(1,n(v.quantite)||1)*n(v.prixTTC)-n(v.remise))/Math.max(1,n(v.quantite)||1)<n(v.plancher))out.push({lvl:"warn",t:"Vente sous le prix plancher",s:esc(v.client)+" · "+dfr(v.date),col:"ventes",id:v.id});
    if(v.statut==="Payée"&&!v.dateEncaissement)out.push({lvl:"info",t:"Vente payée sans date d'encaissement",s:esc(v.client)+" · "+dfr(v.date),col:"ventes",id:v.id});
  }
  for(const d of S.depenses)if(!d.justificatif&&!d.commentaire)out.push({lvl:"info",t:"Dépense sans justificatif",s:esc(d.fournisseur)+" · "+dfr(d.date)+" · "+eur(n(d.montant)),col:"depenses",id:d.id});
  for(const a of S.achats){if(!a.dateReception&&ago(a.date,30))out.push({lvl:"warn",t:"Achat pas encore reçu après 30 jours",s:esc(a.fournisseur)+" · "+dfr(a.date),col:"achats",id:a.id});if(!a.datePaiement)out.push({lvl:"info",t:"Achat sans date de paiement",s:esc(a.fournisseur)+" · "+dfr(a.date),col:"achats",id:a.id})}
  for(const p of S.produits){const q=stockQty(p);if(q!==null&&q<0)out.push({lvl:"bad",t:"Stock négatif",s:esc(p.code)+" : "+q+" (une vente sans pièce en stock ?)",col:"produits",id:p.id})}
  for(const a of S.abonnements){const cur=ym(t);if(aboOccurrences(a).includes(cur)&&!(a.mois||[]).includes(cur)&&Number(t.slice(8))>n(a.jour)+3)out.push({lvl:"info",t:"Abonnement non pointé ce mois-ci",s:esc(a.fournisseur),page:"frais"})}
  return out;
}

function pReferentiel(){

async function saveReferentiel(form){
  const couleurs=[...form.querySelectorAll("#rfLines .line")].map(l=>({nom:l.querySelector(".rfNom").value.trim(),code:l.querySelector(".rfCode").value.trim().toUpperCase(),bonus:n(l.querySelector(".rfBonus").value)})).filter(x=>x.nom&&x.code);
  const modeles=[...form.querySelectorAll("#rmLines .line")].map(l=>({nom:l.querySelector(".rmNom").value.trim(),code:l.querySelector(".rmCode").value.trim().toUpperCase()})).filter(x=>x.nom&&x.code);
  const dup=a=>a.find((x,i)=>a.findIndex(y=>y.code===x.code)!==i);
  const m=$("#refMsg");if(dup(couleurs)){m.textContent="Deux couleurs ont le même code ("+dup(couleurs).code+").";m.hidden=false;return}if(dup(modeles)){m.textContent="Deux modèles ont le même code ("+dup(modeles).code+").";m.hidden=false;return}
  try{await db.doc("reglages/referentiel").set({couleurs,modeles,modifieLe:new Date().toISOString()});toast("Référentiel enregistré")}catch(e){m.textContent=dbErr(e);m.hidden=false}
}

function loadXlsx(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement("script");s.src="vendor/xlsx.full.min.js";s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function exportExcel(){
  try{await loadXlsx()}catch(_){toast("Export impossible hors connexion");return}
  const X=window.XLSX;const wb=X.utils.book_new();const add=(name,rows)=>X.utils.book_append_sheet(wb,X.utils.json_to_sheet(rows.length?rows:[{"(vide)":""}]),name);
  add("Ventes",S.ventes.map(v=>{const p=prod(v.produitId);return{"N° facture":v.numero||"",Date:v.date,Cliente:v.client,Code:p?p.code:"",Désignation:v.designation||"",Quantité:n(v.quantite)||1,"Prix unitaire":n(v.prixTTC),Remise:n(v.remise),Port:n(v.port),Total:venteTotal(v),Statut:v.statut,"Moyen":v.paiement||"","Encaissé le":v.dateEncaissement||"","Avance":v.avanceType||"","Montant avance":n(v.avanceMontant),"Date avance":v.avanceDate||"","Heures":n(v.heures),"Matières (€)":matieresVente(v),"Prix de revient":n(v.revient),"Prix plancher":n(v.plancher),Commentaire:v.commentaire||""}}));
  add("Achats",S.achats.map(a=>{const p=prod(a.produitId);return{"N°":a.ref||"",Date:a.date,Fournisseur:a.fournisseur,"N° facture":a.numFacture||"",Pays:a.pays||"",Code:p?p.code:"",Quantité:n(a.quantite),"Prix unitaire":n(a.prixUnit),Devise:a.devise||"EUR",Taux:n(a.taux)||"","Frais d'approche":n(a.frais),"Coût total (€)":achatTotal(a),"Payé le":a.datePaiement||"",Moyen:a.moyen||"","Reçu le":a.dateReception||"",Commentaire:a.commentaire||""}}));
  add("Dépenses",S.depenses.map(d=>({"N°":d.ref||"",Date:d.date,Fournisseur:d.fournisseur,"N° facture":d.numFacture||"",Catégorie:d.categorie||"",Description:d.description||"",Montant:n(d.montant),"Payé le":d.datePaiement||"",Moyen:d.moyen||"",Justificatif:d.justificatif?"Oui":"Non",Commentaire:d.commentaire||""})));
  add("Abonnements",S.abonnements.map(a=>({Fournisseur:a.fournisseur,Description:a.description||"",Catégorie:a.categorie||"",Montant:n(a.montant),Fréquence:a.frequence||"",Jour:a.jour||"",Début:a.debut||"",Fin:a.fin||"","Mois payés":(a.mois||[]).join(", ")})));
  add("Financement",S.financement.map(f=>({Date:f.date,Nature:f.nature,Description:f.description||"",Montant:n(f.montant)*(L.natures[f.nature]||1),Commentaire:f.commentaire||""})));
  add("Stock",S.produits.map(p=>({Code:p.code,Désignation:designation(p),Statut:p.statut||"",Type:isPrestation(p)?"Prestation":"Marchandise","Prix d'achat":n(p.prixAchat),"Stock de départ":n(p.stockDepart),"En stock":stockQty(p)??"","Coût moyen":isPrestation(p)?"":r2(coutMoyen(p))})));
  add("Corrections stock",S.mouvements.map(m=>{const p=prod(m.produitId);return{Date:m.date,Code:p?p.code:"",Motif:m.motif,Quantité:n(m.quantite)*(L.motifs[m.motif]||-1),Commentaire:m.commentaire||""}}));
  add("Matières",S.matieres.map(m=>({Nom:m.nom,Prix:n(m.prix),Unité:m.unite||"",Fournisseur:m.fournisseur||""})));
  const out=X.write(wb,{bookType:"xlsx",type:"array"});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));a.download="EUGCEO_export_"+today()+".xlsx";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- connexion aux données (Supabase) ---------- */
const SB_URL="https://tlqllrtgyluglkoxhiqx.supabase.co",SB_KEY="sb_publishable_Xv3ztZMMZWPzuIGq0dj_Kg_A1MqH0kb";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const BUCKET="justificatifs";
const loaders=[];
function norm(e){const c=e&&e.code;return{code:c==="42501"||c==="PGRST301"||/row-level security/i.test(e&&e.message||"")?"invalid_argument":/fetch|network/i.test(e&&e.message||"")?"unavailable":"unknown",message:e&&e.message||""}}
function snapDoc(r){return{id:r.id,exists:true,data:()=>r.data}}
function docRef(col,id){return{id,
  async set(data){const{error}=await sb.from(col).upsert({id,data,updated_at:new Date().toISOString()});if(error)throw norm(error)},
  async update(patch){const{data:row,error}=await sb.from(col).select("data").eq("id",id).single();if(error)throw norm(error);
    const{error:e2}=await sb.from(col).update({data:{...row.data,...patch},updated_at:new Date().toISOString()}).eq("id",id);if(e2)throw norm(e2)},
  async delete(){const{error}=await sb.from(col).delete().eq("id",id);if(error)throw norm(error)},
  onSnapshot(next,err){
    const load=async()=>{const{data,error}=await sb.from(col).select("id,data").eq("id",id).maybeSingle();if(error){err&&err(norm(error));return}next(data?snapDoc(data):{id,exists:false,data:()=>undefined})};
    loaders.push(load);load();
    const ch=sb.channel("rt-"+col+"-"+id).on("postgres_changes",{event:"*",schema:"public",table:col,filter:"id=eq."+id},()=>load()).subscribe();
    return()=>sb.removeChannel(ch)}
}}
const dbAdapter={
  collection(col){return{
    doc(id){return docRef(col,id||crypto.randomUUID())},
    async add(data){const r=docRef(col,crypto.randomUUID());await r.set(data);return r},
    onSnapshot(next,err){
      let rows=new Map();const emit=()=>next({docs:[...rows.values()].map(snapDoc)});
      const load=async()=>{const{data,error}=await sb.from(col).select("id,data").limit(5000);if(error){err&&err(norm(error));return}rows=new Map(data.map(r=>[r.id,r]));emit()};
      loaders.push(load);load();
      const ch=sb.channel("rt-"+col).on("postgres_changes",{event:"*",schema:"public",table:col},p=>{
        if(p.eventType==="DELETE")rows.delete(p.old.id);else rows.set(p.new.id,{id:p.new.id,data:p.new.data});emit()}).subscribe();
      return()=>sb.removeChannel(ch)}
  }},
  doc(path){const[c,i]=path.split("/");return docRef(c,i)}
};
const storageAdapter={
  async upload(file,opts){
    const type=(opts&&opts.type)||file.type||"application/octet-stream";
    if(!/^image\//.test(type)&&type!=="application/pdf")throw{code:"unsupported_type"};
    if(file.size>20*1024*1024)throw{code:"too_large"};
    const ext=(file.name&&file.name.includes(".")?file.name.split(".").pop():type.split("/")[1]).toLowerCase().replace(/[^a-z0-9]/g,"");
    const path=today().slice(0,4)+"/"+crypto.randomUUID()+"."+ext;
    const{error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:type,upsert:false});
    if(error)throw{code:"upload_failed",message:error.message};
    return{id:path};
  }
};
async function hydrateAtt(){
  for(const el of document.querySelectorAll("[data-att]")){
    const p=el.dataset.att;el.removeAttribute("data-att");
    const{data,error}=await sb.storage.from(BUCKET).createSignedUrl(p,3600);
    if(error||!data){el.outerHTML=`<span class="hint">Fichier introuvable.</span>`;continue}
    if(/\.pdf$/i.test(p))el.outerHTML=`<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener">Ouvrir le PDF</a>`;
    else el.outerHTML=`<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener"><img src="${esc(data.signedUrl)}" alt="Justificatif"></a>`;
  }
}

/* ---------- connexion de l'utilisateur ---------- */
function showLogin(mode,msg){
  const box=$("#login");box.hidden=false;document.body.style.overflow="hidden";
  const titles={in:"Connexion",up:"Créer mon accès",reset:"Mot de passe oublié",newpw:"Nouveau mot de passe"};
  box.dataset.keep=mode==="newpw"?"1":"";box.innerHTML=`<div class="wrap login-in">
   <div class="login-brand"><img src="icons/icon-192.png" alt="" width="72" height="72"><span class="brand">EUGCEO</span><span class="note">Gestion</span></div>
   <h2>${titles[mode]}</h2>
   <form id="loginForm" class="f" novalidate data-mode="${mode}">
    ${mode!=="newpw"?F("lgEmail","Adresse e-mail",'<input id="lgEmail" type="email" autocomplete="username" inputmode="email" required>'):""}
    ${mode==="in"||mode==="up"||mode==="newpw"?F("lgPw",mode==="in"?"Mot de passe":"Choisis un mot de passe",`<div class="pw"><input id="lgPw" type="password" autocomplete="${mode==="in"?"current-password":"new-password"}" minlength="8" required><button type="button" class="linkbtn" data-act="pw-toggle" aria-pressed="false" aria-controls="lgPw">Afficher</button></div>`,mode==="in"?"":"8 caractères minimum."):""}
    <p class="${msg&&msg.ok?"note":"err"}" id="lgMsg" ${msg?"":"hidden"}>${esc(msg?msg.t:"")}</p>
    <button class="btn" type="submit">${{in:"Se connecter",up:"Créer mon accès",reset:"Recevoir un lien",newpw:"Enregistrer"}[mode]}</button>
   </form>
   <div class="login-links">${mode==="in"?`<button class="linkbtn" data-act="lg" data-m="up">Première fois ? Créer mon accès</button><button class="linkbtn" data-act="lg" data-m="reset">Mot de passe oublié</button>`:mode==="newpw"?"":`<button class="linkbtn" data-act="lg" data-m="in">J'ai déjà un accès</button>`}</div>
  </div>`;
}
function hideLogin(){const b=$("#login");b.hidden=true;b.innerHTML="";document.body.style.overflow=""}
async function loginSubmit(form){
  const mode=form.dataset.mode;const em=$("#lgEmail")?.value.trim();const pw=$("#lgPw")?.value||"";
  const msg=(t,ok)=>{const m=$("#lgMsg");m.textContent=t;m.className=ok?"note":"err";m.hidden=false};
  const btn=form.querySelector("button[type=submit]");btn.disabled=true;
  try{
    if(mode==="in"){const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)msg(/confirm/i.test(error.message)?"Confirme d'abord ton adresse : ouvre le lien reçu par e-mail.":"E-mail ou mot de passe incorrect.")}
    if(mode==="up"){if(pw.length<8){msg("Le mot de passe doit faire au moins 8 caractères.");return}
      const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error)msg(/registered|exists/i.test(error.message)?"Cette adresse a déjà un accès : connecte-toi.":"Création impossible : "+error.message);
      else if(!data.session)showLogin("in",{t:"C'est presque fini : ouvre le lien reçu par e-mail pour confirmer ton adresse, puis connecte-toi.",ok:true})}
    if(mode==="reset"){const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});msg(error?"Envoi impossible. Vérifie l'adresse.":"Si cette adresse a un accès, un lien vient de partir par e-mail.",!error)}
    if(mode==="newpw"){if(pw.length<8){msg("Le mot de passe doit faire au moins 8 caractères.");return}const{error}=await sb.auth.updateUser({password:pw});if(error)msg("Enregistrement impossible : "+error.message);else{$("#login").dataset.keep="";hideLogin();toast("Mot de passe changé")}}
  }finally{btn.disabled=false}
}
let started=false;
async function startData(session){
  myId=session.user.email;user={email:myId};
  const{data:mem}=await sb.from("membres").select("email").eq("email",myId.toLowerCase()).maybeSingle();
  if(!mem){dbState="refus";db=null;render();return}
  db=dbAdapter;assets=storageAdapter;canWrite=true;dbState="ok";render();
  if(started)return;started=true;
  for(const col of COLS){
    db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.add(col);render()},()=>{toast("Données momentanément indisponibles");render()});
  }
  db.doc("reglages/societe").onSnapshot(x=>{S.societe=x.exists?x.data():null;render()},()=>{});
  db.doc("reglages/referentiel").onSnapshot(x=>{S.referentiel=x.exists?x.data():null;render()},()=>{});
  db.doc("reglages/prix").onSnapshot(s=>{if(s.exists)S.reglages={...DEF_REGLAGES,...s.data()};render()},()=>{});
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&db)loaders.forEach(f=>f())});
document.addEventListener("submit",e=>{const id=e.target.id;
  if(id==="loginForm"){e.preventDefault();e.stopImmediatePropagation();loginSubmit(e.target)}
  else if(id==="socForm"){e.preventDefault();e.stopImmediatePropagation();saveSociete(e.target)}
  else if(id==="refForm"){e.preventDefault();e.stopImmediatePropagation();saveReferentiel(e.target)}},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="lg"){showLogin(b.dataset.m)}
  if(b.dataset.act==="logout"){sb.auth.signOut().then(()=>location.reload())}
  if(b.dataset.act==="export"){exportAll()}
});
render();
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="PASSWORD_RECOVERY"){showLogin("newpw");return}
  if(session){if($("#login").dataset.keep!=="1")hideLogin();startData(session)}
});
sb.auth.getSession().then(({data})=>{if(data.session){startData(data.session)}else{dbState="login";render();showLogin("in")}});
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

</script>
